<script>

      ],
      [
        "במה שונה הנבואה בפרק ב' מהנבואה בפרק א'?",
        "פרק א׳ הוא תוכחה על חטאי העם, ופרק ב׳ פותח בחזון אחרית הימים."
      ],
      [
        "לפי רד\"ק, מה פירוש ״באחרית הימים״?",
        "״ימות המשיח״ - עתיד רחוק."
      ],
      [
        "מהי המשמעות הנוספת של הביטוי ״באחרית הימים״ בתנ\"ך?",
        "לפעמים: עתיד קרוב - ״הימים העתידים״ (כך גם ״דעת מקרא״)."
      ],
      [
        "לפי חז\"ל, לאיזו תקופה כוונה נבואת אחרית הימים של ישעיהו?",
        "לימי ישעיהו עצמו - ״ביקש הקב״ה לעשות חזקיהו משיח״ - ורק כשלא התגשמה נדחתה לעתיד רחוק."
      ],
      [
        "כיצד מתוארים ירושלים והר בית ה' בחזון? כתבו שלושה דברים.",
        "1. הר בית ה' יהיה המקום החשוב בעולם - \"בְּרֹאשׁ הֶהָרִים וְנִשָּׂא מִגְּבָעוֹת\". 2. הגויים ירצו את דבר ה' שיוצא מירושלים - \"כִּי מִצִּיּוֹן תֵּצֵא תוֹרָה\". 3. מהמקדש ייצא שלום עולמי המבוסס על משפט צדק - \"וְשָׁפַט בֵּין הַגּוֹיִם... לֹא יִשָּׂא גוֹי אֶל גּוֹי חֶרֶב\"."
      ],
      [
        "לפי רש\"י, מה פירוש ״ונהרו״?",
        "״יתקבצו, ימשכו אליו כנהרות״."
      ],
      [
        "לפי מלבי\"ם, מה פירוש ״ונהרו אליו כל הגוים״?",
        "אף שהמקום גבוה מאוד, הגויים ימשכו אליו ״מרוב חשקם״, כמו נהר שזורם מעצמו."
      ],
      [
        "מה מיוחד בדימוי הנהר ב״ונהרו אליו כל הגוים״?",
        "נהרות זורמים למטה, ואילו העמים יזרמו כלפי מעלה - אל הר בית ה׳ - וימשכו איתם עוד עמים."
      ],
      [
        "מה מבקשים העמים בהר בית ה' בחזון אחרית הימים?",
        "ללמוד את דרכי ה׳: ״ויורנו מדרכיו ונלכה בארחתיו״."
      ],
      [
        "במה שונה עליית העמים לירושלים בפרק ב' מעליית האויב בסוף פרק א'?",
        "בסוף פרק א׳ האויב עלה על ירושלים למלחמה. כאן הגויים עולים אליה כדי לשמוע ממנה את דבר ה׳, לא כדי לכבוש אותה."
      ]
    ]
  },
  {
    "key": "s2",
    "name": "משפט עולמי ושלום - \"וְכִתְּתוּ חַרְבוֹתָם לְאִתִּים\"",
    "icon": "🕊️",
    "color": "#5A6629",
    "qa": [
      [
        "לפי רד\"ק, מי ישפוט בין הגויים באחרית הימים?",
        "מלך המשיח, ״שיהא אדון כל העמים״."
      ],
      [
        "לפי רד\"ק, כיצד ימנע המשפט מלחמות בין העמים?",
        "כשיהיה סכסוך, העמים יבואו למשפט לפני המלך, והוא יוכיח את מי שעשה עוול וישלים ביניהם - ולכן לא יצטרכו כלי מלחמה."
      ],
      [
        "מה יקרה לכלי המלחמה באחרית הימים לפי ישעיהו?",
        "״וכתתו חרבותם לאתים וחניתותיהם למזמרות״ - כלי המלחמה יהפכו לכלי עבודה."
      ],
      [
        "במה נבואת ״וכתתו חרבותם לאתים״ הפוכה מנבואת יואל?",
        "ביואל ההפך: ״כתו אתיכם לחרבות״ - כלי עבודה הופכים לכלי מלחמה."
      ],
      [
        "מדוע הפיכת החרבות לאתים היא הוכחה לשלום אמיתי?",
        "הברזל היה יקר, והעבירו אותו מכלי עבודה לכלי מלחמה ולהפך. כשהברזל ישמש רק לעבודה - סימן שאין עוד צורך במלחמה."
      ]
    ]
  }
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
