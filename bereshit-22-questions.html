<script>
const TOPICS = [
  {
    "key": "s1",
    "name": "מטרת הניסיון",
    "icon": "🎯",

      [
        "אם ה' יודע הכול מראש, מצד מי קיים הניסיון בפועל?",

      [
        "לפי הרמב\"ן, מה מטרת הניסיון?",

      ],
      [
        "לפי הרמב\"ן, מדוע ה' מנסה דווקא צדיקים?",
        "כי ה׳ יודע שהצדיק יעמוד בניסיון ויעשה רצונו (״ה׳ צדיק יבחן״). את הרשעים אינו מנסה."
      ],
      [
        "לפי אברבנאל, ממה נגזרת המילה ״נִסָּה״?",
        "מלשון ״נֵס״ - דגל מורם."
      ],
      [
        "לפי אברבנאל, למי מכוון הניסיון של אברהם?",
        "לעמים ולדורות: מעשה אברהם הוא מופת גלוי, ״עומד לנס עמים, כדגל רם ונשא״."
      ]
    ]
  },
  {
    "key": "s2",
    "name": "הציווי המדורג",
    "icon": "📢",
    "color": "#3F6E66",
    "qa": [
      [
        "מהו הציווי לאברהם בפסוק ב'?",
        "להעלות את יצחק לעולה."
      ],
      [
        "היכן ציווה ה' את אברהם להעלות את יצחק?",
        "על אחד ההרים בארץ המוריה - ״אשר אמר אליך״, הר שה׳ יראה לו."
      ],
      [
        "מדוע פירט ה' את הציווי בשלבים (\"בנך\", \"יחידך\", \"אשר אהבת\", \"יצחק\")?",
        "הפירוט מזהה בהדרגה את יצחק ומכין את אברהם, כדי שלא ייבהל מהציווי הפתאומי."
      ],
      [
        "למי אומר אברהם ״הנני״ בשלוש הפעמים בפרשת העקדה?",
        "לה׳ (פסוק א׳), ליצחק - ״הנני בני״ (פסוק ז׳), ולמלאך ה׳ (פסוק י״א)."
      ],
      [
        "מה מלמדת המילה המנחה ״הנני״ על אברהם?",
        "שהוא מוכן תמיד ומיד להקשיב לדבר ה׳ - ובאותה מילה הוא קשוב גם לבנו."
      ]
    ]
  },
  {
    "key": "s3",
    "name": "\"לֶךְ לְךָ\": בין שני ציוויים",
    "icon": "🧭",
    "color": "#1E2761",
    "qa": [
      [
        "מה משותף לביטוי \"לך לך\" בפרק י\"ב ובפרק כ\"ב?",
        "בשני הציוויים אברהם יוצא ליעד שה׳ יגלה בהמשך."
      ],
      [
        "מתי ניתנת הברכה - מיד עם הציווי או רק אחריו?",
        "בי״ב הברכה ניתנת עם הציווי; בכ״ב רק אחרי העמידה בניסיון."
      ],
      [
        "במה שונה הוויתור הנדרש מאברהם בשני הציוויים?",
        "בי״ב: ארץ, מולדת ובית אב. בכ״ב: הבן האהוב ועתיד הזרע."
      ]
    ]
  },
  {
    "key": "s4",
    "name": "הדרך - זריזות והתבוננות",
    "icon": "🚶",
    "color": "#8B4A34",
    "qa": [
      [
        "מדוע חבש אברהם את החמור בעצמו, לפי רש\"י?",
        "אהבת ה׳ גרמה לו לעשות בעצמו מלאכה שבדרך כלל עושים העבדים."
      ],
      [
        "לפי הרמב\"ן, מה מוכיח אורך מסע שלושת הימים?",
        "שלושה ימים מאפשרים החלטה שקולה; המעשה אינו תוצאה של בהלה רגעית."
      ],
      [
        "מה ההבדל, לפי רש\"י, בין שתי הופעות \"וילכו שניהם יחדיו\"?",

      ]
    ]
  },
  {
    "key": "s5",
    "name": "העקידה, הבשורה וזכות אבות",
    "icon": "⭐",
    "color": "#7A4A73",
    "qa": [
      [
        "לפי רש\"י, מה נתן הניסיון לקב\"ה, כביכול?",
        "אפשרות להראות לשטן ולאומות בפועל שאברהם אוהב את ה׳ וירא אותו."
      ],
      [
        "מדוע נשבע ה' לאברהם דווקא אחרי העקדה?",
        "בשכר העקדה: ״יען אשר עשית את הדבר הזה ולא חשכת את בנך את יחידך״."
      ],
      [
        "איזו הבטחה מוסיף הביטוי ״וירש זרעך את שער איביו״?",
        "שזרעו של אברהם ינצח את אויביו - ולא רק ירבה."
      ],
      [
        "מהי ״זכות אבות״?",
        "מעשי האבות מזכים את בניהם בחסד ה׳."
      ],
      [
        "כיצד נזכרת העקדה בתפילת מוסף של ראש השנה?",
        "מבקשים מה׳ לזכור את העקדה, כדי שמידת הרחמים תגבר על הכעס."
      ],
      [
        "מדוע חשיבותה של עקדת יצחק כה עצומה?",
        "אברהם הפך מסירות נפש למעשה וסלל דרך לדורות שקידשו את שם ה׳."
      ]
    ]
  }
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
