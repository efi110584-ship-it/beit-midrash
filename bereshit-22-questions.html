<script>
const TOPICS = [
{ key:"s1", name:"מטרת הניסיון", icon:"🎯", color:"#8A5C21",
  qa:[
    ["לפי אברבנאל, מדוע ראוי לעיין בפרשת העקדה במיוחד?",
     "כי היא \"כל קרן ישראל וזכותם לפני אביהם שבשמים\", ולכן היא \"שגורה בפינו בתפילתנו כל היום\"."],
    ["אם ה' יודע הכול מראש, מצד מי קיים הניסיון בפועל?",
     "לפי הרמב\"ן, הניסיון הוא מצד האדם - שבידו לבחור אם לבצע את הציווי; מבחינת ה' התוצאה כבר ידועה."],
    ["מה מטרת הניסיון, ומדוע ה' מנסה דווקא צדיקים?",
     "להוציא את הרצון הטוב מן הכוח אל הפועל, כדי לקבל שכר על מעשה ממשי. ה' מנסה צדיק שיודע שיעמוד בניסיון, כדי לזכותו."],
    ["ממה נגזרת המילה \"נִסָּה\", ולמי בעצם מכוון הניסיון?",
     "נגזרת מ\"נס\" - דגל מורם לעיני העמים. מטרתו להפוך את מעשה אברהם למופת גלוי לדורות ולעמים."],
  ]
},
{ key:"s2", name:"הציווי המדורג", icon:"📢", color:"#3F6E66",
  qa:[
    ["מהו הציווי בפסוק ב', והיכן נמצא המקום?",
     "\"קח נא את בנך... והעלהו שם לעולה\". המקום - ארץ המוריה, על אחד ההרים אשר ה' יאמר."],
    ["מדוע פירט ה' את הציווי בשלבים (\"בנך\", \"יחידך\", \"אשר אהבת\", \"יצחק\")?",
     "רש\"י מביא דו-שיח: \"שני בנים יש לי\" - \"את יחידך\"; \"זה יחיד לאמו וזה יחיד לאמו\" - \"אשר אהבת\"; \"שניהם אני אוהב\" - \"את יצחק\". ה' לא אמר מיד \"שלא לערבבו פתאום, ותזוח דעתו עליו ותיטרף\"."],
    ["המילה \"הנני\" היא מילה מנחה בעקדה. למי אומר אותה אברהם, ומה היא מלמדת?",
     "לה' (א'), ליצחק - \"הנני בני\" (ז'), ולמלאך ה' (י\"א). תשובתו המיידית מראה על נכונותו המתמדת להקשיב לדבר ה' - וגם לבנו הוא קשוב באותה מילה."],
  ]
},
{ key:"s3", name:'"לֶךְ לְךָ": בין שני ציוויים', icon:"🧭", color:"#1E2761",
  qa:[
    ["מה משותף לביטוי \"לך לך\" בפרק י\"ב ובפרק כ\"ב?",
     "בשני המקרים היעד אינו ידוע מראש: \"אל הארץ אשר אראך\" ו\"על אחד ההרים אשר אומר אליך\"."],
    ["מתי ניתנת הברכה - מיד עם הציווי או רק אחריו?",
     "בפרק י\"ב - מיד עם הציווי. בפרק כ\"ב - רק לאחר העמידה בניסיון."],
    ["במה שונה הוויתור הנדרש מאברהם בשני הציוויים?",
     "בפרק י\"ב - על הארץ, המולדת ובית האב. בעקדה - על הבן היחיד והאהוב, עתיד הזרע."],
  ]
},
{ key:"s4", name:"הדרך - זריזות והתבוננות", icon:"🚶", color:"#8B4A34",
  qa:[
    ["מדוע חבש אברהם את החמור בעצמו, לפי רש\"י?",
     "\"הוא בעצמו ולא צוה לאחד מעבדיו, שהאהבה מקלקלת השורה\" - מאהבת ה' עשה בעצמו מה שעושים בדרך כלל העבדים."],
    ["לפי הרמב\"ן, מה מוכיח אורך מסע שלושת הימים?",
     "שאברהם פעל ביישוב הדעת ומתוך החלטה שקולה, ולא מתוך בהלה רגעית."],
    ["מה ההבדל, לפי רש\"י, בין שתי הופעות \"וילכו שניהם יחדיו\"?",
     "בפסוק ו' יצחק אינו יודע ובכל זאת הולכים יחד; בפסוק ח' הוא כבר מבין שהוא העולה וממשיך מרצון - שניהם הולכים \"בלב שווה\"."],
  ]
},
{ key:"s5", name:"העקידה, הבשורה וזכות אבות", icon:"⭐", color:"#7A4A73",
  qa:[
    ["לפי רש\"י, מה נתן הניסיון לקב\"ה, כביכול?",
     "\"פתחון פה\" להשיב לשטן ולאומות ולגלות בפועל מדוע אברהם אהוב וירא אלוקים."],
    ["מדוע השבועה והברכה באות דווקא בשלב זה, ומה מוסיף \"וירש זרעך את שער איביו\"?",
     "לאחר שאברהם הוכיח מסירות מלאה. הביטוי מוסיף שזרעו לא רק ירבה, אלא גם יגבר על אויביו."],
    ["מהי \"זכות אבות\", ואיך העקדה נזכרת בתפילת מוסף של ראש השנה?",
     "מעשי האבות מעניקים חסד והגנה לצאצאיהם לדורות. במוסף אנו מבקשים: \"ועקדת יצחק היום לזרעו תזכור\" - כשם שאברהם \"כבש רחמיו\" לעשות רצון ה', כן יכבשו רחמי ה' את כעסו."],
    ["מדוע חשיבותה של עקדת יצחק כה עצומה?",
     "אברהם היה הראשון שהוריד את המסירות נפש מן המחשבה אל המעשה, וסלל בכך דרך לדורות הבאים שנדרשו למסור נפשם על קידוש השם."],
  ]
},
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
