<div class="wrap" id="main-content" role="main">

  <header>
    <h1>🗂️ ספר יונה (פרקים ג׳-ד׳) — כרטיסיות לחזרה</h1>
    <p class="sub">לחצו על כרטיסייה כדי להפוך אותה ולראות את התשובה. אפשר לערבב את הסדר ולתרגל שוב ושוב.</p>
  </header>

  <div class="game-nav"><a href="yonah-3.html">→ פרק ג׳</a> · <a href="yonah-4.html">פרק ד׳ ←</a></div>

  <div class="controls">
    <span class="revealed-stat"><span id="revealedCount">0</span> / <span id="totalCount">0</span> נחשפו</span>
    <button class="ctrl-btn" id="shuffleBtn" type="button">🔀 ערבבו את הסדר</button>
    <button class="ctrl-btn" id="resetBtn" type="button">↺ הפכו הכל בחזרה</button>

</div>

<button id="toTopBtn" class="to-top-btn" aria-label="חזרה לראש העמוד" title="חזרה לראש העמוד" type="button">&#8593;</button>

<footer class="site-footer">ספר יונה · פרקים ג׳-ד׳ · כרטיסיות לחזרה</footer>

<script>
const TOPICS = [
{ key:"s1", name:"השליחות השנייה וקיום הנבואה", icon:"📯", color:"#3F6E66",
  qa:[
    ["מה מצווה ה' על יונה בפעם השנייה?",
     "לקום וללכת לנינווה ולהכריז עליה את הקריאה שה' יאמר לו - בלי לגלות לו מראש את התוכן."],
    ["איך יונה מגיב הפעם, בשונה מפרק א'?",
     "הוא מציית - קם והולך ישר לנינווה, בניגוד לבריחה שלו בפרק א'."],
    ["איך יונה ממלא את השליחות במידה המועטה ביותר?",
     "הוא נכנס לעיר (שלוקח 3 ימי הליכה לעבור) רק יום אחד, ואומר משפט קצר אחד בלבד: \"עוד ארבעים יום ונינווה נהפכת\"."],
    ["לפי רד\"ק, מה פירוש \"נינווה נהפכת\"?",
     "שהעיר תיחרב, כמו סדום ועמורה - כי מעשי אנשי נינווה היו רעים כמו מעשיהם."],
  ]
},
{ key:"s2", name:"תשובת אנשי נינווה", icon:"🙏", color:"#1E2761",
  qa:[
    ["איך מתחילה תשובת אנשי נינווה?",
     "כל אנשי העיר, מהגדול ועד הקטן, מאמינים בה', קוראים צום ולובשים שקים - מרצונם."],
    ["מה עושה מלך נינווה כששומע על כך?",
     "קם מכיסאו, מעביר את אדרתו, מתכסה בשק ויושב על האפר, ומוציא צו רשמי לכל העיר."],
    ["מהן שתי הדרישות הנוספות (מלבד הצום) שגוזר המלך?",
     "שגם האדם וגם הבהמה יתכסו בשקים ויזעקו לה' בקול חזק, ושכל אחד ישוב מדרכו הרעה ומהחמס שבידיו."],
    ["איך מגיב ה' לתשובת אנשי נינווה?",
     "ה' רואה שהם שבו מדרכם הרעה, ומתנחם מהרעה שתכנן להביא עליהם - ולא עושה אותה."],
  ]
},
{ key:"s3", name:"כעס יונה, הקיקיון, והלימוד", icon:"🌿", color:"#8B4A34",
  qa:[
    ["איך מגיב יונה לכך שה' סלח לנינווה?",
     "הוא כועס כעס גדול ומבקש מה' שייקח את נשמתו, כי טוב מותו מחייו."],
    ["מה עושה ה' כדי ללמד את יונה שיעור?",
     "מצמיח לו קיקיון שנותן לו צל ומשמח אותו, ואז שולח תולעת שמייבשת אותו ורוח קדים חמה שמכה בראשו."],
    ["מהו הקל וחומר שה' אומר ליונה בסוף?",
     "אם יונה חס על קיקיון קטן שלא טרח בו ולא גידל אותו, קל וחומר שה' חס על נינווה - עיר גדולה מלאה בבני אדם ובעלי חיים."],
    ["לפי רד\"ק, על מי חס יונה באמת, ומדוע ה' חס על נינווה?",
     "יונה בעצם חס על עצמו (על הצער שלו), ואילו ה' חס על נינווה מפני כבודו - כי כל הנבראים, ובפרט בני האדם, הם כבודו של ה' בעולם."],
  ]
},
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
</body>
