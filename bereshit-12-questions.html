<script>
const TOPICS = [
{ key:"s1", name:'רקע - הבחירה באברהם', icon:"📜", color:"#8A5C21",
  qa:[
    ["מה ההבדל, לפי המהר\"ל, בין הבחירה בנח לבין הבחירה באברהם?",

    ["מדוע, לפי המהר\"ל, התורה לא כתבה מהן הסיבות לבחירת אברהם?",
     "כי הבחירה באברהם היא \"בחירה כללית\" - בחירה באומה שתצא ממנו - והיא לא הייתה תלויה במעשיו האישיים. לכן אין צורך לנמק אותה, והיא גם לא יכולה להתבטל."],
  ]
},
{ key:"s2", name:'"לך לך" - הציווי וההבטחה', icon:"🧭", color:"#3F6E66",
  qa:[
    ["מהו הקושי הלשוני ב\"מארצך וממולדתך ומבית אביך\", וכיצד מיישב אותו הרמב\"ן?",
     "הקושי: למה ה' לא אומר ישר \"לך לך מבית אביך\", אלא מאריך ואומר גם \"ארצך\" וגם \"מולדתך\"? הרמב\"ן: זו לא חזרה מיותרת - קשה לעזוב את הארץ, קשה יותר את מקום המולדת, והכי קשה - את בית האב. הפירוט מדגיש כמה גדול היה הניסיון."],
    ["מדוע, לדעת הרד\"ק, ה' לא גילה לאברהם לאיזו ארץ הוא הולך?",
     "דווקא ההסתרה מגדילה את הניסיון - אברהם הסכים ללכת בלי לדעת לאן, וזה מראה את גודל אמונתו."],
    ["מהם שלושת חלקי הברכה שה' מבטיח לאברהם?",
     "(1) להיות לגוי גדול. (2) שם גדול. (3) שכל משפחות האדמה יתברכו בזכותו."],
  ]
},
{ key:"s3", name:"המסע לארץ כנען", icon:"🐫", color:"#1E2761",
  qa:[
    ["מהן תחנות המסע של אברהם בארץ כנען, ואיזו הבטחה הוא מקבל בפסוק ז'?",
     "שכם ← בית אל והעי ← הנגב. ההבטחה: \"לזרעך אתן את הארץ הזאת\" - ומיד בונה אברהם מזבח לה'."],
    ["מה ההבדל בין שני המזבחות שאברהם בונה - בשכם (פסוק ז') ובבית אל (פסוק ח')?",
     "המזבח בשכם נבנה כתגובה אישית מיד אחרי שה' נגלה אליו והבטיח \"לזרעך אתן את הארץ הזאת\". המזבח בבית אל נבנה בלי התגלות נוספת, אבל הפעם אברהם גם \"קורא בשם ה'\" - יוצא ומכריז את אמונתו כלפי הסובבים אותו."],
    ["מהם שני הפירושים של רש\"י למילה \"עשו\" ב\"הנפש אשר עשו בחרן\"?",
     "פשט: עבדים ושפחות שקנו. דרש: אנשים שגיירו - אברהם את הגברים, שרה את הנשים."],
    ["אילו שתי מילים מנחות חוזרות בפסוקים א'-ט', ומה הן מבליטות?",
     "\"ארץ\" ו\"אברם\" - כל אחת שבע פעמים. החזרה מבליטה את ראשית הקשר הנצחי בין עם ישראל לארץ ישראל, דרך הברית עם אברהם."],
  ]
},
{ key:"s4", name:"הירידה למצרים", icon:"👑", color:"#8B4A34",
  qa:[
    ["למה אברהם יורד למצרים, ומה הוא מבקש משרה לומר?",
     "בגלל רעב כבד בכנען. הוא מבקש שתאמר שהיא אחותו, כי חשש שיהרגו אותו כדי לקחת אותה."],

    ["כיצד ה' מציל את שרה, וכיצד מסתיים הסיפור?",
     "ה' מכה את פרעה ואת ביתו בנגעים. פרעה מבין שטעה, מחזיר את שרה, ומשלח אותם עם כל רכושם."],
  ]

  qa:[
    ["מהו הכלל שמלמד הרמב\"ן?",
     "מה שקרה לאבות הוא רמז למה שיקרה לבניהם, עם ישראל, בעתיד. לכן התורה מספרת בפירוט על מסעות האבות."],
    ["תנו דוגמה אחת להקבלה בין מה שקרה לאברהם למה שקרה לבניו.",
     "סיבת הירידה: אברהם ירד למצרים בגלל רעב, ובדיוק כך ירדו בני ישראל למצרים בגלל רעב בימי יעקב."],
    ["מהו \"השילוח הנחרץ\" בהקבלה של הרמב\"ן?",
     "פרעה מגרש את אברהם ממצרים (\"וַיְצַו עָלָיו פַּרְעֹה אֲנָשִׁים וַיְשַׁלְּחוּ אֹתוֹ\"), וכך גם המצרים ממהרים לשלח את בני ישראל ממצרים בעקבות עשר המכות."],
  ]
},
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
