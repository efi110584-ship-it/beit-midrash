<style>

  .teacher-note{
    max-width:760px; margin:0 auto 1.4rem; text-align:center; font-size:.88rem; color:var(--ink-soft);

  }

  /* ========== בורר פרקים ========== */
  .chapter-picker{ display:flex; flex-wrap:wrap; gap:.6rem; justify-content:center; margin:0 0 1.6rem; }
  .chapter-btn{
    font-family:'Frank Ruhl Libre',serif; font-weight:800; font-size:.95rem; cursor:pointer;
    padding:.55rem 1.2rem; border-radius:999px; border:2px solid var(--paper-line); background:#fff; color:var(--ink);
    transition:border-color .2s ease, background .2s ease, color .2s ease, transform .15s ease;
  }
  .chapter-btn:hover{ transform:translateY(-1px); }
  .chapter-btn[aria-selected="true"]{ background:var(--acc); border-color:var(--acc); color:#fff; }

  .chapter-panel{ display:none; }
  .chapter-panel.active{ display:block; }
  main .grid{ display:block; }

  .chapter-head{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:.8rem;
    background:var(--paper-card); border:1.5px solid var(--paper-line); border-radius:14px;
    padding:1rem 1.3rem; margin-bottom:1.4rem;
  }
  .chapter-head h2{ margin:0; font-family:'Frank Ruhl Libre',serif; font-size:1.25rem; color:var(--ink); }
  .chapter-head .sub-small{ margin:.2rem 0 0; font-size:.82rem; color:var(--ink-soft); }

  .speak-btn{
    font-family:'Heebo',sans-serif; font-size:.8rem; font-weight:700; cursor:pointer; white-space:nowrap;
    padding:.5rem 1rem; border-radius:999px; border:1.5px solid var(--acc); background:#fff; color:var(--acc);
    display:inline-flex; align-items:center; gap:.4rem; transition:background .2s ease, color .2s ease;
  }
  .speak-btn:hover{ background:var(--acc); color:#fff; }
  .speak-btn.speaking{ background:var(--teal); border-color:var(--teal); color:#fff; }
  .speak-btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .speak-btn.small{ font-size:.72rem; padding:.35rem .75rem; align-self:flex-start; }
  .speak-btn.topic-speak-btn{ flex:none; margin-inline-start:auto; }

  /* ========== תשובה, במקום textarea/hint-box ========== */
  .ans-block{
    background:var(--teal-soft); border:1.5px solid var(--teal); border-radius:10px;
    padding:.65rem .85rem; display:flex; flex-direction:column; gap:.3rem;
  }
  .ans-label{ font-weight:800; font-size:.72rem; color:var(--teal); text-transform:uppercase; letter-spacing:.02em; }
  .ans-text{ font-size:.88rem; line-height:1.6; color:var(--ink); }

.q-cue{ font-size:.8rem; color:var(--acc); font-style:italic; margin:.6rem 0 .35rem; flex-basis:100%; }

  /* אישור הבנת פרשן - כפתור קטן בתחתית כל קובית מפרש, במקום רשימת סיכום נפרדת */
  .qb-meforesh{ position:relative; }
  .qb-meforesh-foot{ display:flex; justify-content:flex-end; margin-top:.5rem; }
  .mp-tile-btn{
    font-family:'Heebo',sans-serif; font-size:.72rem; font-weight:700; cursor:pointer; min-height:30px;
    padding:.3rem .8rem; border-radius:999px; border:1.5px solid var(--acc); background:#fff; color:var(--acc);
    transition:background .2s ease, color .2s ease, border-color .2s ease; flex:none;
  }
  .mp-tile-btn:hover{ background:var(--acc); color:#fff; }
  .qb-meforesh.completed{ background:var(--teal-soft); border-color:var(--teal); }
  .qb-meforesh.completed .qb-src{ color:var(--teal); }
  .qb-meforesh.completed .mp-tile-btn{ background:var(--teal); border-color:var(--teal); color:#fff; }

  .mini-timeline.detail .step{ flex:1 1 140px; text-align:center; gap:.3rem; padding:.6rem .6rem; }
  .mini-timeline.detail .step b{ font-family:'Frank Ruhl Libre',serif; font-weight:800; font-size:.88rem; color:var(--ink); }
  .mini-timeline.detail .step small{ display:block; font-size:.68rem; line-height:1.35; color:var(--ink-soft); }
  .mini-timeline.detail .step small.why{ color:var(--rust); font-weight:700; }
  .mini-timeline{ margin-top:.7rem; }
  .mini-timeline.compact .step{ font-size:.68rem; padding:.4rem .3rem; }
  .step.fail{ background:var(--rust-soft); border-color:var(--rust); }
  .step.fail small{ color:var(--rust); font-weight:700; }

  .vs-compare{ display:flex; align-items:stretch; gap:0; margin:.7rem 0; border-radius:12px; overflow:hidden; box-shadow:var(--shadow); }
  .vs-side{ flex:1; padding:.7rem .8rem; display:flex; flex-direction:column; align-items:center; text-align:center; gap:.3rem; }
  .vs-a{ background:var(--teal-soft); }
  .vs-b{ background:var(--acc-soft); }
  .vs-icon{ font-size:1.35rem; }
  .vs-title{ font-family:'Frank Ruhl Libre',serif; font-weight:800; font-size:.85rem; color:var(--ink); }
  .vs-desc{ font-size:.72rem; line-height:1.45; color:var(--ink-soft); }
  .vs-mid{ flex:none; width:2rem; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:.72rem; color:#fff; background:var(--ink); }

  .plan-reality{ display:flex; flex-direction:column; gap:.55rem; margin:.7rem 0; }
  .pr-row{ display:flex; flex-direction:column; gap:.3rem; }
  .pr-label{ font-weight:800; font-size:.76rem; color:var(--acc); }

  .flowchart{ display:flex; flex-direction:column; align-items:center; gap:0; margin:.7rem 0; }

<p style="text-align:center; margin:1.6rem 0;">
  <button class="hint-btn" type="button" id="answersGateBtn" data-gated="true">🔒 פתחו את המחוון (נדרש קוד מהמורה)</button>
</p>

<main>
<div id="gatedContent" hidden></div>
</main>

<footer class="credit">פרקי יוסף ואחיו · מחוון תשובות למורה</footer>

<script>
(function(){
  "use strict";
  var ANSWERS_CODE = '5703531';
  var gateBtn = document.getElementById('answersGateBtn');
  var gatedContent = document.getElementById('gatedContent');

  /* ===== הקראה (Web Speech API) - עצמאי מתוכן הפרקים ===== */
  var synth = window.speechSynthesis;
  var supported = !!synth;
  var currentBtn = null;
  var hebrewVoice = null;

  function pickHebrewVoice(){
    if(!supported) return;
    var voices = synth.getVoices();
    hebrewVoice = voices.find(function(v){ return /^he/i.test(v.lang); }) || null;
  }
  if(supported){
    pickHebrewVoice();
    synth.addEventListener("voiceschanged", pickHebrewVoice);
  }

  function stopSpeaking(){
    if(!supported) return;
    synth.cancel();
    if(currentBtn){ currentBtn.classList.remove("speaking"); currentBtn.dataset.originalText && (currentBtn.textContent = currentBtn.dataset.originalText); }
    currentBtn = null;
  }

  function collectText(container){
    var parts = [];
    container.querySelectorAll(".qa-item").forEach(function(item){
      var q = item.querySelector(".qa-q");
      var a = item.querySelector(".qa-a");
      if(q) parts.push(q.textContent.trim());
      if(a) parts.push("תשובה. " + a.textContent.trim());
    });
    return parts.join(". ");
  }

  function speak(text, btn, labelWhenIdle){
    if(!supported || !text) return;
    var wasThisBtn = currentBtn === btn;
    stopSpeaking();
    if(wasThisBtn) return; /* לחיצה שנייה על אותו כפתור = רק עצירה */

    var utter = new SpeechSynthesisUtterance(text);
    utter.lang = "he-IL";
    if(hebrewVoice) utter.voice = hebrewVoice;
    utter.rate = 0.95;

    btn.dataset.originalText = labelWhenIdle;
    btn.textContent = "⏹ עצירה";
    btn.classList.add("speaking");
    currentBtn = btn;

    utter.onend = function(){
      if(currentBtn === btn){ btn.classList.remove("speaking"); btn.textContent = labelWhenIdle; currentBtn = null; }
    };
    utter.onerror = utter.onend;

    synth.speak(utter);
  }

  /* ===== חיווט האינטראקציה בתוכן הפרקים - רק אחרי שהתוכן הוזרק ל-DOM ===== */
  function wireGatedContent(){
    var chapterBtns = Array.prototype.slice.call(document.querySelectorAll(".chapter-btn"));
    var panels = Array.prototype.slice.call(document.querySelectorAll(".chapter-panel"));

    chapterBtns.forEach(function(btn){
      btn.addEventListener("click", function(){
        var target = btn.dataset.chapter;
        chapterBtns.forEach(function(b){ b.setAttribute("aria-selected", b === btn ? "true" : "false"); });
        panels.forEach(function(p){ p.classList.toggle("active", p.id === "chapter-" + target); });
        stopSpeaking();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });

    if(!supported){
      document.querySelectorAll(".speak-btn").forEach(function(b){
        b.disabled = true;
        b.title = "הדפדפן שלכם אינו תומך בהקראה קולית";
      });
    }

    document.querySelectorAll(".speak-item").forEach(function(btn){
      var label = btn.textContent;
      btn.addEventListener("click", function(){
        var item = btn.closest(".qa-item");
        speak(collectText(item), btn, label);
      });
    });

    document.querySelectorAll(".speak-topic").forEach(function(btn){
      var label = btn.textContent;
      btn.addEventListener("click", function(e){
        e.stopPropagation();
        var container = document.getElementById(btn.dataset.target);
        speak(collectText(container), btn, label);
      });
    });

    document.querySelectorAll(".speak-chapter").forEach(function(btn){
      var label = btn.textContent;
      btn.addEventListener("click", function(){
        var chapter = document.getElementById(btn.dataset.target);
        speak(collectText(chapter), btn, label);
      });
    });
  }

  /* התוכן עצמו (כל שאלות התשובות) לא קיים ב-DOM כלל עד אימות הקוד - */
  /* מקודד ב-Base64 בסוף העמוד, ומפוענח ומוזרק רק לאחר קוד נכון. */
  function b64ToUtf8(b64){
    var binary = window.atob(b64);
    var bytes = new Uint8Array(binary.length);
    for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function unlockContent(){
    if(gatedContent.childElementCount === 0){
      gatedContent.innerHTML = b64ToUtf8(window.LOCKED_HTML_B64);
      wireGatedContent();
    }
    gatedContent.hidden = false;
  }

  function isTeacherUnlocked(){
    try{ return sessionStorage.getItem('teacherAreaUnlocked') === '1'; }
    catch(e){ return false; }
  }

  if(gateBtn && gatedContent){
    if(isTeacherUnlocked()){
      /* LOCKED_HTML_B64 מוגדר בתגית <script> נפרדת שמגיעה אחרי זו במסמך -
         ממתינים ל-DOMContentLoaded כדי לוודא שהיא כבר הוגדרה. */
      document.addEventListener('DOMContentLoaded', function(){
        unlockContent();
        gateBtn.textContent = '🔓 הקוד אושר';
        gateBtn.disabled = true;
      });
    }
    gateBtn.addEventListener('click', function(){
      var code = prompt('הקלידו את הקוד שקיבלתם מהמורה כדי לפתוח את המחוון:');
      if(code === null) return;
      if(code.trim() === ANSWERS_CODE){
        try{ sessionStorage.setItem('teacherAreaUnlocked', '1'); }catch(e){}
        unlockContent();
        gateBtn.textContent = '🔓 הקוד אושר';
        gateBtn.disabled = true;
      } else {
        alert('קוד שגוי. נסו שוב, או שאלו את המורה.');
      }
    });
  }

  window.addEventListener("beforeunload", stopSpeaking);
})();
