<script>
const TOPICS = [
  {
    "key": "s1",
    "name": "הקול הראשון - \"נַחֲמוּ נַחֲמוּ עַמִּי\"",

    "qa": [
      [
        "על איזו גלות מנחמות נבואות ישעיהו מפרק מ' ואילך?",
        "על השיבה מגלות בבל."

      [
        "מה מיוחד בכך שנבואות הנחמה של ישעיהו עוסקות בגלות בבל?",
        "ישעיהו ניבא בערך בשנת 700 לפני הספירה - גלות בבל עוד לא קרתה בימיו. הוא ניבא עליה לחזקיהו (פרק ל״ט), ואחרי הנבואה הזאת סודרו נבואות הנחמה."
      ],
      [
        "מה אומר הקול הראשון (פסוקים א'-ב')?",
        "קול ה׳ מצווה לנחם את העם ולדבר על לב ירושלים."
      ],
      [
        "מהי הסיבה לנחמה בפסוק ב'?",
        "״כי מלאה צבאה, כי נרצה עונה״ - ירושלים ריצתה את תקופת עונשה (״צבאה״ - הזמן הקצוב לעונש)."
      ],
      [
        "מה עולה מן הביטוי ״כי מלאה צבאה״ על זמן הגלות?",
        "שזמן הגלות קצוב, ולאחריו ירושלים תיבנה מחדש."
      ]
    ]
  },
  {
    "key": "s2",
    "name": "הקול השני - \"פַּנּוּ דֶּרֶךְ ה'\"",
    "icon": "🛤️",
    "color": "#8A5C21",
    "qa": [
      [
        "מה מצווה הקול השני (פסוקים ג'-ה')?",
        "לסלול לה׳ במדבר דרך ישרה, בלי עליות ומורדות: ״כל גיא ינשא וכל הר וגבעה ישפלו״."
      ],
      [
        "האם הקול השני מצווה לסלול דרך ממש? הסבירו.",
        "לא. ה׳ אינו זקוק לדרך - יישור הדרך הוא מטפורה לשיבה מהירה וישירה, בלי מכשולים, של ישראל מבבל לארצם."
      ],
      [
        "כתבו שתי נקודות דמיון בין תיאור הגאולה בפרק מ' ליציאת מצרים.",
        "הליכה במדבר - ״במדבר פנו דרך ה׳״; ה׳ נגלה לעיני כולם - ״ונגלה כבוד ה׳ וראו כל בשר יחדו״; ויציאה ברכוש - ״הנה שכרו אתו״."
      ],
      [
        "מה מלמדת ההשוואה בין הגאולה מבבל ליציאת מצרים?",
        "כמו שה׳ הוציא עם עבדים מאימפריה עצומה, כך יוציא את ישראל מן הגלות."
      ]
    ]
  },
  {
    "key": "s3",
    "name": "הקול השלישי - \"כָּל הַבָּשָׂר חָצִיר\"",
    "icon": "🌾",
    "color": "#5A6629",
    "qa": [
      [
        "הקול השלישי (פסוקים ו'-ח') משווה את האדם לחציר ולציץ. כיצד קשור קול זה לנחמה? הסבירו לפי אחד הפרשנים.",
        "רש\"י: כל אדם \"סוף אדם למות\", ולכן אי אפשר לסמוך על הבטחתו - \"כשמת האדם בטלה הבטחתו\"; אבל \"דבר אלהינו יקום\", כי ה' חי וקיים - ולכן אפשר לסמוך על הבטחת הגאולה. או מצודת דוד: \"כל הבשר חציר\" - העמים שיבואו עם גוג על ירושלים יבולו כחציר, ודבר ה' שהבטיח על ידי הנביאים יתקיים."
      ]
    ]
  },
  {
    "key": "s4",
    "name": "הקול הרביעי - \"מְבַשֶּׂרֶת צִיּוֹן\"",
    "icon": "📣",
    "color": "#7A4A73",
    "qa": [
      [
        "מה עושה ״מבשרת ציון״ בקול הרביעי (פסוק ט')?",
        "עולה על הר גבוה ומכריזה בקול ובלי פחד שכבוד ה׳ קרב ובא לירושלים, ואיתו שבי הגולה."
      ],
      [
        "מהי הקריאה שיש להשמיע לערי יהודה (פסוק ט')?",
        "״הנה אלהיכם״."
      ],
      [
        "מהי התמונה הראשונה של ה' בפסוק י', ואיזו מידה היא מבטאת?",
        "מנהיג שמפלס את דרכו בכוח - ״בחזק יבוא וזרעו משלה לו״ - מידת הדין."
      ],
      [
        "מהי התמונה השנייה של ה' בפסוק י\"א, ואיזו מידה היא מבטאת?",
        "רועה שמנהיג את צאנו ומקבץ בזרועו את הטלאים - ״כרעה עדרו ירעה״ - מידת הרחמים."
      ]
    ]
  }
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
