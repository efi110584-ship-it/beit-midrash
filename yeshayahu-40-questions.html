<footer class="site-footer">ספר ישעיהו · פרק מ׳ · שאלות ותשובות לחזרה</footer>

<script>
const TOPICS = [
{
"key": "s1",
"name": "\"נחמו נחמו עמי\" - תם העוון",
"icon": "🕊️",
"color": "#3F6E66",
"qa": [
[
"מדוע פותח הנביא בכפילות \"נַחֲמוּ נַחֲמוּ\"? מה מבשר פסוק זה, בהשוואה לטון ששרר בפרק א' ובפרק ה'?",
"הכפילות מדגישה ומחזקת את עוצמת הניחומים. פסוק זה מבשר נחמה של ממש, בניגוד חד לטון התוכחה והקינה ששרר בפרקים א' וה': שם תואר עונש וחטא, וכאן - לראשונה - מתבשר סיום העונש ותחילת הנחמה."
],
[
"מהי הבשורה המרכזית שיש להעביר לירושלים בפסוק ב', ומדוע יש צורך \"לדבר על לבה\"?",
"הבשורה: תקופת העונש הסתיימה, עוון ירושלים נסלח וקיבלה עונש כפול. יש לדבר על ליבה כי היא שרויה בייאוש ונדרשים דברי חיזוק רגשיים, לא רק הודעה עובדתית."
]
]
},
{
"key": "s2",
"name": "קול קורא במדבר - כל בשר חציר, ודבר אלוקינו יקום לעולם",
"icon": "🏜️",
"color": "#8A5C21",
"qa": [
[
"תארו את ארבעת שינויי הנוף הנדרשים כדי להכין את \"דרך ה'\". לאיזה אירוע היסטורי מוקדם יותר מזכירה תמונת המסע הזאת?",
"הגיא יינשא, ההר והגבעה יושפלו, הדרך העקומה תיושר, וההרים המחוברים יהפכו לבקעה - כל המכשולים יוסרו. תמונה זו מזכירה את יציאת מצרים: מסע גאולה חדש, במתכונת דומה."
],
[
"איזה ניגוד עומד במרכז פסוקים ו'-ח', ומה, על פי מצודת דוד, נמשל לחציר ולציץ הנובל?",
"הניגוד: ארעיות בני האדם (חציר וציץ נובלים) מול נצחיות דבר ה'. לפי מצודת דוד, החציר נמשל לעם עצמו - חולף וכלה, בשונה מדבר ה'."
]
]
},
{
"key": "s3",
"name": "מבשרת ציון - האל בא כגיבור וכרועה",
"icon": "📯",
"color": "#7A4A73",
"qa": [
[
"מיהי \"מבשרת ציון\", ומהי הבשורה שעליה להכריז בקול רם וללא פחד לערי יהודה?",
"\"מבשרת ציון\" היא ירושלים עצמה, הנקראת לעלות על הר גבוה כדי שקולה יישמע למרחוק. הבשורה: \"הנה אלוקיכם\" - ה' עצמו שב ומתגלה לעמו."
],
[
"שני התיאורים הסמוכים של ה' (גיבור כובש ורועה עדין) נראים כמנוגדים. הסבירו כל אחד בקצרה, והציעו כיצד הם משלימים זה את זה.",
"התיאור הראשון: גיבור כובש הבא בעוצמה ובזרוע נטויה. התיאור השני: רועה עדין ורחום, הנושא את הטלאים החלשים בחיקו. הם משלימים זה את זה: העוצמה האדירה פועלת דווקא כדי להגן על עמו ברוך ובחמלה."
]
]
}
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
</body>
