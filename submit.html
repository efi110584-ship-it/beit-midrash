<!DOCTYPE html>
<html lang="he" dir="rtl" data-css="submit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגשת מטלה | הכיתה הדיגיטלית</title>
<meta name="description" content="הגשת מטלה או דף עבודה - הכיתה הדיגיטלית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=8">

<script src="assets/a11y.js"></script>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן המרכזי</a>
<div class="wrap">
  <div class="breadcrumb">
    <a href="index.html">הכיתה הדיגיטלית</a> &raquo; הגשת מטלה
  </div>

  <header class="page-header">
    <h1>הגשת מטלה</h1>
    <p>מלאו את הפרטים וצרפו את הקובץ - ההגשה עוברת ישירות למורה, ללא צורך בהתחברות או בכתובת מייל.</p>
  </header>

  <main id="main" class="card">
    <form id="submitForm" novalidate>
      <div class="field">
        <label for="studentName">שם מלא <span class="required-mark">*</span></label>
        <input type="text" id="studentName" name="studentName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="studentClass">כיתה <span class="required-mark">*</span></label>
        <select id="studentClass" name="studentClass" required>
          <option value="" disabled selected>בחרו כיתה</option>
          <option value="יא1">י"א 1</option>
          <option value="יא2">י"א 2</option>
          <option value="יא3">י"א 3</option>
          <option value="יא4">י"א 4</option>
          <option value="יב">י"ב</option>
        </select>
      </div>

      <div class="field">
        <label for="unitSelect">יחידה <span class="required-mark">*</span></label>
        <select id="unitSelect" name="unit" required>
          <option value="" disabled selected>בחרו יחידה</option>
        </select>
      </div>

      <div class="field" id="topicField" hidden>
        <label for="topicSelect">נושא / פרק <span class="required-mark">*</span></label>
        <select id="topicSelect" name="topic" required></select>
      </div>

      <div class="field" id="otherField" hidden>
        <label for="assignment">שם המטלה <span class="required-mark">*</span></label>
        <input type="text" id="assignment" name="assignment" placeholder="לדוגמה: עבודת סיכום על ספר יונה">
        <p class="hint">רק אם המטלה לא מופיעה ברשימה.</p>
      </div>

      <div class="field">
        <label for="fileInput">קובץ להגשה <span class="required-mark">*</span></label>
        <div class="file-drop">
          <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
        </div>
        <p class="hint">קובצי PDF, Word או תמונה, עד 5MB.</p>
      </div>

      <div class="field">
        <label for="notes">הערות (לא חובה)</label>
        <textarea id="notes" name="notes" placeholder="משהו שחשוב שהמורה ידע לגבי ההגשה הזו"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">שליחת ההגשה</button>

      <div class="status-box error" id="errorBox" role="alert"></div>
    </form>

    <div class="success-panel" id="successPanel" hidden>
      <div class="icon">&#10003;</div>
      <h2>ההגשה נשלחה בהצלחה!</h2>
      <p>המורה קיבל הודעה על ההגשה שלך. אפשר לסגור את הדף.</p>
      <button type="button" class="again-btn" id="againBtn">הגשת מטלה נוספת</button>
    </div>
  </main>
</div>

<script src="assets/units-data.js"></script>
<script src="assets/bm-api.js"></script>
<script>
(function () {
  // כתובת ה-Web App של סקריפט הקליטה (Google Apps Script)
  // כתובת ה-Web App של סקריפט הקליטה - ב-assets/bm-api.js
  var ENDPOINT_URL = window.BM_API_URL || '';
  var MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB

  var form = document.getElementById('submitForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorBox = document.getElementById('errorBox');
  var successPanel = document.getElementById('successPanel');
  var againBtn = document.getElementById('againBtn');
  var fileInput = document.getElementById('fileInput');

  /* ---------- יחידה ← נושא (מתוך assets/units-data.js) ----------
     המטלה נשלחת כ"יחידה · נושא", כדי שבלוח ההגשות כל נושא יקבל שורה וציון משלו. */
  var T = window.BM_TASKS;
  var unitSelect = document.getElementById('unitSelect');
  var topicSelect = document.getElementById('topicSelect');
  var topicField = document.getElementById('topicField');
  var otherField = document.getElementById('otherField');
  var otherInput = document.getElementById('assignment');
  var UNITS_LIST = T ? T.units() : [];
  var OTHER = '__other';

  function opt(value, text){ var o = document.createElement('option'); o.value = value; o.textContent = text; return o; }
  ['יא', 'יב'].forEach(function(cls){
    var group = document.createElement('optgroup');
    group.label = cls === 'יא' ? 'כיתה י"א' : 'כיתה י"ב';
    UNITS_LIST.forEach(function(u, i){ if(u.class === cls) group.appendChild(opt(String(i), u.title)); });
    if(group.children.length) unitSelect.appendChild(group);
  });
  unitSelect.appendChild(opt(OTHER, 'מטלה אחרת (לכתוב בעצמי)'));

  function fillTopics(){
    var v = unitSelect.value;
    topicSelect.innerHTML = '';
    if(v === OTHER || v === ''){
      topicField.hidden = true;
      otherField.hidden = v !== OTHER;
      otherInput.required = v === OTHER;
      return;
    }
    var u = UNITS_LIST[+v];
    topicSelect.appendChild(opt('', 'בחרו נושא'));
    topicSelect.options[0].disabled = true;
    topicSelect.options[0].selected = true;
    (u.topics || []).forEach(function(t, j){ topicSelect.appendChild(opt(String(j), t.title)); });
    topicSelect.appendChild(opt('all', 'כל היחידה / עבודה כללית'));
    topicField.hidden = false;
    otherField.hidden = true;
    otherInput.required = false;
  }
  unitSelect.addEventListener('change', fillTopics);

  function currentAssignment(){
    var v = unitSelect.value;
    if(v === OTHER) return otherInput.value.trim();
    if(v === '' || !topicSelect.value) return '';
    var u = UNITS_LIST[+v];
    return T.assignmentFor(u, topicSelect.value === 'all' ? null : u.topics[+topicSelect.value]);
  }

  /* קישור מדף עבודה (?assignment=...): בוחרים את היחידה והנושא המתאימים, ואם אין - "מטלה אחרת" */
  function prefillAssignment(text){
    var c = T ? T.classify(text) : null;
    var ui = -1;
    if(c) UNITS_LIST.forEach(function(u, i){ if(u.title === c.unit) ui = i; });
    if(ui === -1){
      unitSelect.value = OTHER; fillTopics(); otherInput.value = text; return;
    }
    unitSelect.value = String(ui); fillTopics();
    (UNITS_LIST[ui].topics || []).forEach(function(t, j){
      if(T.fileSafe(t.title) === c.topic) topicSelect.value = String(j);
    });
  }

  // מילוי מראש מפרמטרים בכתובת - מגיע מקישור "הגשת מטלה" מתוך דף עבודה עצמו
  (function prefillFromQuery(){
    var qp = new URLSearchParams(window.location.search);
    var qName = qp.get('name');
    var qCls = qp.get('cls');
    var qAssignment = qp.get('assignment');
    var qUnit = qp.get('unit');
    var qTopic = qp.get('topic');
    if(!qAssignment && (qUnit || qTopic)){
      qAssignment = [qUnit, qTopic].filter(Boolean).join(' - ');
    }
    if(qName) document.getElementById('studentName').value = qName;
    if(qCls){
      var clsSelect = document.getElementById('studentClass');
      Array.prototype.forEach.call(clsSelect.options, function(opt){
        if(opt.value === qCls.replace(/["'׳״\s.-]/g, '')) opt.selected = true;
      });
    }
    if(qAssignment) prefillAssignment(qAssignment);
  })();
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result; // "data:<mime>;base64,XXXX"
        var base64 = result.substring(result.indexOf(',') + 1);
        resolve(base64);
      };
      reader.onerror = function () { reject(new Error('שגיאה בקריאת הקובץ')); };
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var studentName = document.getElementById('studentName').value.trim();
    var studentClass = document.getElementById('studentClass').value;
    var assignment = currentAssignment();
    var notes = document.getElementById('notes').value.trim();
    var file = fileInput.files[0];

    if (!studentName || !studentClass || !assignment || !file) {
      if (studentName && studentClass && file && !assignment) {
        showError(unitSelect.value === OTHER ? 'כתבו את שם המטלה.' : 'בחרו יחידה ונושא.');
        return;
      }
      showError('נא למלא את כל שדות החובה (מסומנים ב-*) ולצרף קובץ.');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      showError('הקובץ גדול מדי (מעל 5MB). נא לצרף קובץ קטן יותר.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'שולח...';

    fileToBase64(file).then(function (base64) {
      var payload = {
        studentName: studentName,
        studentClass: studentClass.slice(0, 2),
        section: studentClass.slice(2),
        assignment: assignment,
        notes: notes,
        fileName: file.name,
        fileMimeType: file.type || 'application/octet-stream',
        fileBase64: base64
      };

      return fetch(ENDPOINT_URL, {
        method: 'POST',
        // חשוב: text/plain כדי להימנע מ-preflight שסקריפטים של Google לא תומכים בו
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    }).then(function (response) {
      return response.json();
    }).then(function (data) {
      if (data && data.ok) {
        form.hidden = true;
        successPanel.hidden = false;
      } else {
        throw new Error((data && data.error) || 'שגיאה לא ידועה מהשרת');
      }
    }).catch(function (err) {
      console.error(err);
      showError('משהו השתבש בשליחה. אפשר לנסות שוב, ואם זה חוזר על עצמו - לשלוח למורה ישירות. (' + err.message + ')');
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'שליחת ההגשה';
    });
  });

  againBtn.addEventListener('click', function () {
    form.reset();
    fillTopics();
    form.hidden = false;
    successPanel.hidden = true;
    clearError();
  });
})();
</script>
<script src="assets/lesson-mode.js"></script>
<script src="assets/class-dock.js"></script>
</body>
</html>
