<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגשת מטלה | בית המדרש הדיגיטלי</title>
<meta name="description" content="הגשת מטלה או דף עבודה - בית המדרש הדיגיטלי">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #b8873a;
    --gold-dark: #8f6526;
    --blue: #1f3a5f;
    --blue-dark: #142743;
    --bg: #faf6ee;
    --card: #ffffff;
    --border: #e4d9c3;
    --text: #2b2b2b;
    --muted: #6b6b6b;
    --success: #2f7d4f;
    --error: #b3372c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Heebo', Arial, sans-serif;
    min-height: 100vh;
    padding: 24px 16px 60px;
  }
  h1, h2 { font-family: 'Frank Ruhl Libre', serif; }
  a { color: var(--blue); }
  .skip-link {
    position: absolute;
    right: -999px;
    top: 0;
    background: var(--blue);
    color: #fff;
    padding: 10px 16px;
    z-index: 100;
  }
  .skip-link:focus { right: 8px; top: 8px; }
  .wrap { max-width: 640px; margin: 0 auto; }
  .breadcrumb {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 20px;
  }
  .breadcrumb a { color: var(--blue); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  header.page-header {
    text-align: center;
    margin-bottom: 28px;
  }
  header.page-header h1 {
    color: var(--blue-dark);
    font-size: 1.9rem;
    margin: 0 0 8px;
  }
  header.page-header p {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 24px;
    box-shadow: 0 2px 10px rgba(31,58,95,0.06);
  }
  label {
    display: block;
    font-weight: 700;
    margin-bottom: 6px;
    font-size: 0.95rem;
  }
  .required-mark { color: var(--error); }
  .field { margin-bottom: 20px; }
  input[type="text"],
  select,
  textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    background: #fffefb;
    color: var(--text);
  }
  input[type="text"]:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid var(--gold);
    outline-offset: 1px;
  }
  textarea { resize: vertical; min-height: 80px; }
  .file-drop {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 18px;
    text-align: center;
    background: #fbf8f1;
  }
  .file-drop input { display: block; margin: 0 auto; width: 100%; }
  .hint { font-size: 0.82rem; color: var(--muted); margin-top: 6px; }
  .submit-btn {
    width: 100%;
    background: var(--blue);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .submit-btn:hover:not(:disabled) { background: var(--blue-dark); }
  .submit-btn:disabled { background: #9aa7b5; cursor: not-allowed; }
  .status-box {
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.95rem;
    display: none;
  }
  .status-box.show { display: block; }
  .status-box.error {
    background: #fbeceb;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .success-panel {
    text-align: center;
    padding: 20px 10px 6px;
  }
  .success-panel .icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--success);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem;
    margin: 0 auto 14px;
  }
  .success-panel h2 { color: var(--success); margin: 0 0 8px; font-size: 1.4rem; }
  .success-panel p { color: var(--muted); margin: 0 0 20px; }
  .again-btn {
    display: inline-block;
    background: transparent;
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .again-btn:hover { background: #eef2f7; }
  form[hidden], .success-panel[hidden] { display: none; }
</style>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן המרכזי</a>
<div class="wrap">
  <div class="breadcrumb">
    <a href="index.html">בית המדרש הדיגיטלי</a> &raquo; הגשת מטלה
  </div>

  <header class="page-header">
    <h1>הגשת מטלה</h1>
    <p>מלאו את הפרטים וצרפו את הקובץ - ההגשה עוברת ישירות למורה, ללא צורך בהתחברות או בכתובת מייל.</p>
  </header>

  <main id="main" class="card">
    <form id="submitForm" novalidate>
      <div class="field">
        <label for="studentName">שם מלא <span class="required-mark">*</span></label>
        <input type="text" id="studentName" name="studentName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="studentClass">כיתה <span class="required-mark">*</span></label>
        <select id="studentClass" name="studentClass" required>
          <option value="" disabled selected>בחרו כיתה</option>
          <option value="יא">י"א</option>
          <option value="יב">י"ב</option>
        </select>
      </div>

      <div class="field">
        <label for="assignment">שם המטלה / דף העבודה <span class="required-mark">*</span></label>
        <input type="text" id="assignment" name="assignment" placeholder="לדוגמה: דף עבודה - יונה פרק ג׳" required>
      </div>

      <div class="field">
        <label for="fileInput">קובץ להגשה <span class="required-mark">*</span></label>
        <div class="file-drop">
          <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
        </div>
        <p class="hint">קובצי PDF, Word או תמונה, עד 5MB.</p>
      </div>

      <div class="field">
        <label for="notes">הערות (לא חובה)</label>
        <textarea id="notes" name="notes" placeholder="משהו שחשוב שהמורה ידע לגבי ההגשה הזו"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">שליחת ההגשה</button>

      <div class="status-box error" id="errorBox" role="alert"></div>
    </form>

    <div class="success-panel" id="successPanel" hidden>
      <div class="icon">&#10003;</div>
      <h2>ההגשה נשלחה בהצלחה!</h2>
      <p>המורה קיבל הודעה על ההגשה שלך. אפשר לסגור את הדף.</p>
      <button type="button" class="again-btn" id="againBtn">הגשת מטלה נוספת</button>
    </div>
  </main>
</div>

<script>
(function () {
  // כתובת ה-Web App של סקריפט הקליטה (Google Apps Script)
  var ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbwkhxAu28oe10-Mli0tSUj-pb0rpxGmEioPdquopkPrnIvKw2TZmZw1PmlwhDZ3AUSPXw/exec';
  var MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB

  var form = document.getElementById('submitForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorBox = document.getElementById('errorBox');
  var successPanel = document.getElementById('successPanel');
  var againBtn = document.getElementById('againBtn');
  var fileInput = document.getElementById('fileInput');

  // מילוי מראש מפרמטרים בכתובת - מגיע מקישור "הגשת מטלה" מתוך דף עבודה עצמו
  (function prefillFromQuery(){
    var qp = new URLSearchParams(window.location.search);
    var qName = qp.get('name');
    var qCls = qp.get('cls');
    var qAssignment = qp.get('assignment');
    var qUnit = qp.get('unit');
    var qTopic = qp.get('topic');
    if(!qAssignment && (qUnit || qTopic)){
      qAssignment = [qUnit, qTopic].filter(Boolean).join(' - ');
    }
    if(qName) document.getElementById('studentName').value = qName;
    if(qCls){
      var clsSelect = document.getElementById('studentClass');
      Array.prototype.forEach.call(clsSelect.options, function(opt){
        if(opt.value === qCls) opt.selected = true;
      });
    }
    if(qAssignment) document.getElementById('assignment').value = qAssignment;
  })();
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result; // "data:<mime>;base64,XXXX"
        var base64 = result.substring(result.indexOf(',') + 1);
        resolve(base64);
      };
      reader.onerror = function () { reject(new Error('שגיאה בקריאת הקובץ')); };
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var studentName = document.getElementById('studentName').value.trim();
    var studentClass = document.getElementById('studentClass').value;
    var assignment = document.getElementById('assignment').value.trim();
    var notes = document.getElementById('notes').value.trim();
    var file = fileInput.files[0];

    if (!studentName || !studentClass || !assignment || !file) {
      showError('נא למלא את כל שדות החובה (מסומנים ב-*) ולצרף קובץ.');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      showError('הקובץ גדול מדי (מעל 5MB). נא לצרף קובץ קטן יותר.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'שולח...';

    fileToBase64(file).then(function (base64) {
      var payload = {
        studentName: studentName,
        studentClass: studentClass,
        assignment: assignment,
        notes: notes,
        fileName: file.name,
        fileMimeType: file.type || 'application/octet-stream',
        fileBase64: base64
      };

      return fetch(ENDPOINT_URL, {
        method: 'POST',
        // חשוב: text/plain כדי להימנע מ-preflight שסקריפטים של Google לא תומכים בו
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    }).then(function (response) {
      return response.json();
    }).then(function (data) {
      if (data && data.ok) {
        form.hidden = true;
        successPanel.hidden = false;
      } else {
        throw new Error((data && data.error) || 'שגיאה לא ידועה מהשרת');
      }
    }).catch(function (err) {
      console.error(err);
      showError('משהו השתבש בשליחה. אפשר לנסות שוב, ואם זה חוזר על עצמו - לשלוח למורה ישירות. (' + err.message + ')');
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'שליחת ההגשה';
    });
  });

  againBtn.addEventListener('click', function () {
    form.reset();
    form.hidden = false;
    successPanel.hidden = true;
    clearError();
  });
})();
</script>
</body>
</html>
