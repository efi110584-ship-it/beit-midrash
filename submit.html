<!DOCTYPE html>
<html lang="he" dir="rtl" data-css="submit">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הגשת מטלה | הכיתה הדיגיטלית</title>
<meta name="description" content="הגשת מטלה או דף עבודה - הכיתה הדיגיטלית">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css?v=1">

<script src="assets/a11y.js"></script>
</head>
<body>
<a href="#main" class="skip-link">דלג לתוכן המרכזי</a>
<div class="wrap">
  <div class="breadcrumb">
    <a href="index.html">הכיתה הדיגיטלית</a> &raquo; הגשת מטלה
  </div>

  <header class="page-header">
    <h1>הגשת מטלה</h1>
    <p>מלאו את הפרטים וצרפו את הקובץ - ההגשה עוברת ישירות למורה, ללא צורך בהתחברות או בכתובת מייל.</p>
  </header>

  <main id="main" class="card">
    <form id="submitForm" novalidate>
      <div class="field">
        <label for="studentName">שם מלא <span class="required-mark">*</span></label>
        <input type="text" id="studentName" name="studentName" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="studentClass">כיתה <span class="required-mark">*</span></label>
        <select id="studentClass" name="studentClass" required>
          <option value="" disabled selected>בחרו כיתה</option>
          <option value="יא">י"א</option>
          <option value="יב">י"ב</option>
        </select>
      </div>

      <div class="field">
        <label for="assignment">שם המטלה / דף העבודה <span class="required-mark">*</span></label>
        <input type="text" id="assignment" name="assignment" placeholder="לדוגמה: דף עבודה - יונה פרק ג׳" required>
      </div>

      <div class="field">
        <label for="fileInput">קובץ להגשה <span class="required-mark">*</span></label>
        <div class="file-drop">
          <input type="file" id="fileInput" name="file" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" required>
        </div>
        <p class="hint">קובצי PDF, Word או תמונה, עד 5MB.</p>
      </div>

      <div class="field">
        <label for="notes">הערות (לא חובה)</label>
        <textarea id="notes" name="notes" placeholder="משהו שחשוב שהמורה ידע לגבי ההגשה הזו"></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">שליחת ההגשה</button>

      <div class="status-box error" id="errorBox" role="alert"></div>
    </form>

    <div class="success-panel" id="successPanel" hidden>
      <div class="icon">&#10003;</div>
      <h2>ההגשה נשלחה בהצלחה!</h2>
      <p>המורה קיבל הודעה על ההגשה שלך. אפשר לסגור את הדף.</p>
      <button type="button" class="again-btn" id="againBtn">הגשת מטלה נוספת</button>
    </div>
  </main>
</div>

<script>
(function () {
  // כתובת ה-Web App של סקריפט הקליטה (Google Apps Script)
  var ENDPOINT_URL = 'https://script.google.com/macros/s/AKfycbwkhxAu28oe10-Mli0tSUj-pb0rpxGmEioPdquopkPrnIvKw2TZmZw1PmlwhDZ3AUSPXw/exec';
  var MAX_FILE_BYTES = 5 * 1024 * 1024; // 5MB

  var form = document.getElementById('submitForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorBox = document.getElementById('errorBox');
  var successPanel = document.getElementById('successPanel');
  var againBtn = document.getElementById('againBtn');
  var fileInput = document.getElementById('fileInput');

  // מילוי מראש מפרמטרים בכתובת - מגיע מקישור "הגשת מטלה" מתוך דף עבודה עצמו
  (function prefillFromQuery(){
    var qp = new URLSearchParams(window.location.search);
    var qName = qp.get('name');
    var qCls = qp.get('cls');
    var qAssignment = qp.get('assignment');
    var qUnit = qp.get('unit');
    var qTopic = qp.get('topic');
    if(!qAssignment && (qUnit || qTopic)){
      qAssignment = [qUnit, qTopic].filter(Boolean).join(' - ');
    }
    if(qName) document.getElementById('studentName').value = qName;
    if(qCls){
      var clsSelect = document.getElementById('studentClass');
      Array.prototype.forEach.call(clsSelect.options, function(opt){
        if(opt.value === qCls) opt.selected = true;
      });
    }
    if(qAssignment) document.getElementById('assignment').value = qAssignment;
  })();
  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.add('show');
  }
  function clearError() {
    errorBox.textContent = '';
    errorBox.classList.remove('show');
  }
  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var result = reader.result; // "data:<mime>;base64,XXXX"
        var base64 = result.substring(result.indexOf(',') + 1);
        resolve(base64);
      };
      reader.onerror = function () { reject(new Error('שגיאה בקריאת הקובץ')); };
      reader.readAsDataURL(file);
    });
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var studentName = document.getElementById('studentName').value.trim();
    var studentClass = document.getElementById('studentClass').value;
    var assignment = document.getElementById('assignment').value.trim();
    var notes = document.getElementById('notes').value.trim();
    var file = fileInput.files[0];

    if (!studentName || !studentClass || !assignment || !file) {
      showError('נא למלא את כל שדות החובה (מסומנים ב-*) ולצרף קובץ.');
      return;
    }
    if (file.size > MAX_FILE_BYTES) {
      showError('הקובץ גדול מדי (מעל 5MB). נא לצרף קובץ קטן יותר.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'שולח...';

    fileToBase64(file).then(function (base64) {
      var payload = {
        studentName: studentName,
        studentClass: studentClass,
        assignment: assignment,
        notes: notes,
        fileName: file.name,
        fileMimeType: file.type || 'application/octet-stream',
        fileBase64: base64
      };

      return fetch(ENDPOINT_URL, {
        method: 'POST',
        // חשוב: text/plain כדי להימנע מ-preflight שסקריפטים של Google לא תומכים בו
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
    }).then(function (response) {
      return response.json();
    }).then(function (data) {
      if (data && data.ok) {
        form.hidden = true;
        successPanel.hidden = false;
      } else {
        throw new Error((data && data.error) || 'שגיאה לא ידועה מהשרת');
      }
    }).catch(function (err) {
      console.error(err);
      showError('משהו השתבש בשליחה. אפשר לנסות שוב, ואם זה חוזר על עצמו - לשלוח למורה ישירות. (' + err.message + ')');
    }).finally(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'שליחת ההגשה';
    });
  });

  againBtn.addEventListener('click', function () {
    form.reset();
    form.hidden = false;
    successPanel.hidden = true;
    clearError();
  });
})();
</script>
</body>
</html>
