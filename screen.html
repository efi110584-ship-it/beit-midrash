<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מסך הקרנה | הכיתה הדיגיטלית</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B2A5B; --blue:#123A78; --orange:#FF7A1A; --ink:#0E1B33; --muted:#56637A; --line:#DCE4F1; --bg:#F6F8FC; }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Heebo","Rubik",Arial,sans-serif; display:flex; flex-direction:column; }
  .visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .bar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:14px 28px; background:var(--navy); color:#fff; }
  .bar-title{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:1.2rem; }
  .bar-title::before{ content:""; width:12px; height:12px; border-radius:50%; background:#FF5A4E; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }
  .bar-count{ font-family:"Rubik",sans-serif; font-size:1.2rem; font-variant-numeric:tabular-nums; }
  .bar button{ min-height:40px; padding:6px 14px; border:1px solid rgba(255,255,255,.35); border-radius:10px; background:transparent; color:#fff; font:inherit; cursor:pointer; }
  .bar button:focus-visible{ outline:3px solid var(--orange); outline-offset:2px; }
  main{ flex:1 1 auto; width:100%; max-width:1600px; margin:0 auto; padding:28px 40px 20px; display:flex; flex-direction:column; gap:24px; }
  .eyebrow{ margin:0; font-size:1.4rem; font-weight:700; color:var(--orange); }
  h1{ margin:0; font-family:"Frank Ruhl Libre",serif; font-size:clamp(2rem, 4.2vw, 3.6rem); line-height:1.25; color:var(--blue); text-wrap:balance; }
  .stage{ flex:1 1 auto; display:flex; flex-direction:column; justify-content:center; gap:28px; }
  .closed{ align-self:flex-start; padding:6px 16px; border-radius:999px; background:#FFEBDC; color:#8A3D07; font-weight:700; font-size:1.2rem; }
  .empty{ text-align:center; color:var(--muted); font-size:1.8rem; }
  .join{ padding:12px 28px; background:#fff; border-top:1px solid var(--line); text-align:center; font-size:1.35rem; color:var(--muted); }
  .join b{ color:var(--ink); }
  /* לוח שאלות על המקרן */
  .wall{ list-style:none; margin:0; padding:0; display:grid; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr)); gap:18px; align-items:start; }
  .note{ padding:18px 20px 14px; border-radius:6px 6px 18px 6px; box-shadow:0 2px 4px rgba(0,0,0,.06), 0 10px 22px rgba(60,40,10,.10); }
  .note-q{ margin:0 0 10px; font-size:1.6rem; line-height:1.4; font-weight:600; overflow-wrap:anywhere; }
  .note-meta{ display:flex; gap:12px; font-size:1.05rem; color:#4A4F57; }
  .note-done{ display:inline-block; margin-bottom:8px; padding:2px 10px; border-radius:999px; background:#1F7A4D; color:#fff; font-size:.95rem; font-weight:700; }
  .note.is-done .note-q{ opacity:.7; }
  [hidden]{ display:none !important; }
</style>
</head>
<body>
<div class="bar">
  <span class="bar-title" id="scTitle">מסך הקרנה</span>
  <span class="bar-count" id="scCount" aria-live="polite"></span>
  <button type="button" id="scFull">מסך מלא</button>
</div>
<main>
  <p class="eyebrow" id="scType"></p>
  <h1 id="scPrompt">טוען…</h1>
  <span class="closed" id="scClosed" hidden>התשובות נסגרו</span>
  <div class="stage" id="scStage"></div>
</main>
<div class="join" id="scJoin"></div>

<script src="assets/bm-api.js"></script>
<script src="assets/live-render.js"></script>
<script>
/* מסך הקרנה לכיתה.
   screen.html            - הפעילות החיה (ענן מילים / הצבעה)
   screen.html?room=1234  - הפעילות של הכיתה עם קוד 1234 (הקישור מהאזור האישי ומהסרגל כולל אותו)
   screen.html?board=X    - לוח השאלות של הדף X */
(function(){
  "use strict";
  var API = window.BM_API_URL, L = window.BM_LIVE;
  var $ = function(id){ return document.getElementById(id); };
  var board = (new URLSearchParams(location.search).get("board") || "").replace(/[^\w-]/g, "");
  var room = (new URLSearchParams(location.search).get("room") || "").replace(/\D/g, "").slice(0, 6);
  var COLORS = ["#FFF3B8", "#FFD9E1", "#D6ECFF", "#D9F5E3", "#EBDFFF", "#FFE2C6"];
  var last = "";

  var base = location.href.replace(/[^\/]*$/, "");
  $("scJoin").innerHTML = board
    ? 'רוצים להוסיף שאלה? נכנסים לדף הפרק באתר וכותבים בלוח השאלות.'
    : room ? 'משתתפים מהטלפון: <b>' + L.esc(base.replace(/^https?:\/\//, "")) + '</b> ← "יש לכם קוד מהמורה?" ← <b>' + room + '</b>. הפעילות תופיע בצד המסך.'
    : 'משתתפים מהטלפון: <b>' + L.esc(base.replace(/^https?:\/\//, "")) + '</b> ← הכפתור האדום <b>"פעילות בכיתה עכשיו"</b>';

  $("scFull").addEventListener("click", function(){
    if(document.fullscreenElement) document.exitFullscreen();
    else if(document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });

  function colorOf(id){ var h = 0; for(var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0; return COLORS[h % COLORS.length]; }

  function loadActivity(){
    fetch(API + "?action=actCurrent" + (room ? "&exact=1&room=" + room : "")).then(function(r){ return r.json(); }).then(function(res){
      var json = JSON.stringify(res);
      if(json === last) return;
      last = json;
      var a = res && res.activity;
      if(!a){
        $("scTitle").textContent = "פעילות בכיתה"; $("scType").textContent = ""; $("scCount").textContent = "";
        $("scPrompt").textContent = "עוד אין פעילות פעילה"; $("scClosed").hidden = true;
        $("scStage").innerHTML = '<p class="empty">מפעילים פעילות מהאזור האישי ← לשונית "בשיעור".</p>';
        return;
      }
      var r = res.results || {};
      $("scTitle").textContent = a.type === "cloud" ? "ענן מילים" : (a.type === "survey" ? "סקר" : "הצבעה");
      $("scType").textContent = a.type === "cloud" ? "☁️ ענן מילים" : (a.type === "survey" ? "📋 סקר" + (a.anonymous ? " · אנונימי" : "") : "🗳️ הצבעה");
      $("scPrompt").textContent = a.prompt;
      $("scClosed").hidden = !!a.open;
      $("scCount").textContent = (r.count || 0) + (r.count === 1 ? " תלמיד ענה" : " תלמידים ענו");
      $("scStage").innerHTML = a.type === "survey" ? L.surveyHtml(a, r, "big", { showTexts:true, limit:6 })
        : a.type === "cloud" ? L.cloudHtml(r.words, "big")
        : L.pollHtml(a, r, "big") + L.reasonsHtml(a, r, "big", false, 6);
    }).catch(function(){});
  }

  function loadBoard(){
    fetch(API + "?action=qbList&board=" + encodeURIComponent(board)).then(function(r){ return r.json(); }).then(function(res){
      var json = JSON.stringify(res && res.items);
      if(json === last) return;
      last = json;
      $("scTitle").textContent = "לוח שאלות"; $("scType").textContent = "❓ לוח שאלות";
      $("scPrompt").textContent = "אילו שאלות עולות לכם מהתקציר?";
      if(!res || !res.ok){ $("scStage").innerHTML = '<p class="empty">' + L.esc((res && res.error) || "") + '</p>'; return; }
      var items = res.items || [];
      $("scCount").textContent = items.length + (items.length === 1 ? " שאלה" : " שאלות");
      $("scStage").innerHTML = items.length ? '<ul class="wall">' + items.map(function(it){
        return '<li class="note' + (it.done ? " is-done" : "") + '" style="background:' + colorOf(it.id) + '">' +
          (it.done ? '<span class="note-done">✓ נדון בכיתה</span>' : '') +
          '<p class="note-q">' + L.esc(it.text) + '</p>' +
          '<div class="note-meta"><b>' + L.esc(it.name) + '</b>' + (it.likes ? '<span>🙋 ' + it.likes + '</span>' : '') + '</div></li>';
      }).join("") + '</ul>' : '<p class="empty">עוד אין שאלות בלוח.</p>';
    }).catch(function(){});
  }

  var load = board ? loadBoard : loadActivity;
  load();
  setInterval(function(){ if(document.visibilityState === "visible") load(); }, board ? 6000 : 4000);
})();
</script>
</body>
</html>
