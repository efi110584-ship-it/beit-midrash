<script>
/* The scene is a pure function of time, render(t). The MP4 above is produced by
   opening this page with ?render=1 and capturing one frame per 1/30 s;
   the soundtrack is synthesized separately to the same timeline. */
(() => {
if (!new URLSearchParams(location.search).has('render')) return;
document.body.classList.add('render');

const W = 1280, H = 720, DURATION = 114;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const SERIF = '"Frank Ruhl Libre", "DejaVu Serif", serif';
const SANS = '"Heebo", "DejaVu Sans", sans-serif';
const EMOJI = '"Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", sans-serif';

/* ---------- helpers ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const prog = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, f = .8) => Math.min(prog(t, a, a + f), 1 - prog(t, b - f, b));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (c1, c2, k) => { const a = hex(c1), b = hex(c2); return '#' + a.map((v, i) => Math.round(lerp(v, b[i], k)).toString(16).padStart(2, '0')).join(''); };
function key(frames, t) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1] = frames[i];
    if (t <= t1) {
      const [t0, v0] = frames[i - 1], k = ease(prog(t, t0, t1));
      if (Array.isArray(v0)) return v0.map((c, j) => typeof c === 'string' ? mix(c, v1[j], k) : lerp(c, v1[j], k));
      return lerp(v0, v1, k);
    }
  }
  return frames[frames.length - 1][1];
}

/* ---------- verse captions (text from bereshit-15-text.html) ---------- */
const CAPTIONS = [
  [6, 14, 'א', 'אַחַר הַדְּבָרִים הָאֵלֶּה הָיָה דְבַר ה\' אֶל אַבְרָם בַּמַּחֲזֶה לֵאמֹר: אַל תִּירָא אַבְרָם, אָנֹכִי מָגֵן לָךְ, שְׂכָרְךָ הַרְבֵּה מְאֹד.'],
  [14, 20, 'ג', 'וַיֹּאמֶר אַבְרָם: הֵן לִי לֹא נָתַתָּה זָרַע, וְהִנֵּה בֶן בֵּיתִי יוֹרֵשׁ אֹתִי.'],
  [20, 27, 'ה', 'וַיּוֹצֵא אֹתוֹ הַחוּצָה וַיֹּאמֶר: הַבֶּט נָא הַשָּׁמַיְמָה וּסְפֹר הַכּוֹכָבִים אִם תּוּכַל לִסְפֹּר אֹתָם; וַיֹּאמֶר לוֹ: כֹּה יִהְיֶה זַרְעֶךָ.'],
  [27, 31, 'ו', 'וְהֶאֱמִן בַּה\', וַיַּחְשְׁבֶהָ לּוֹ צְדָקָה.'],
  [31, 37, 'ח', 'וַיֹּאמַר: אֲדֹנָי ה\' בַּמָּה אֵדַע כִּי אִירָשֶׁנָּה.'],
  [37, 45, 'ט', 'וַיֹּאמֶר אֵלָיו: קְחָה לִי עֶגְלָה מְשֻׁלֶּשֶׁת וְעֵז מְשֻׁלֶּשֶׁת וְאַיִל מְשֻׁלָּשׁ, וְתֹר וְגוֹזָל.'],
  [45, 53, 'י', 'וַיִּקַּח לוֹ אֶת כָּל אֵלֶּה וַיְבַתֵּר אֹתָם בַּתָּוֶךְ, וַיִּתֵּן אִישׁ בִּתְרוֹ לִקְרַאת רֵעֵהוּ; וְאֶת הַצִּפֹּר לֹא בָתָר.'],
  [53, 60, 'יא', 'וַיֵּרֶד הָעַיִט עַל הַפְּגָרִים, וַיַּשֵּׁב אֹתָם אַבְרָם.'],
  [60, 68, 'יב', 'וַיְהִי הַשֶּׁמֶשׁ לָבוֹא וְתַרְדֵּמָה נָפְלָה עַל אַבְרָם, וְהִנֵּה אֵימָה חֲשֵׁכָה גְדֹלָה נֹפֶלֶת עָלָיו.'],
  [68, 74, 'יג', 'וַיֹּאמֶר לְאַבְרָם: יָדֹעַ תֵּדַע כִּי גֵר יִהְיֶה זַרְעֲךָ בְּאֶרֶץ לֹא לָהֶם, וַעֲבָדוּם וְעִנּוּ אֹתָם אַרְבַּע מֵאוֹת שָׁנָה.'],
  [74, 80, 'יד', 'וְגַם אֶת הַגּוֹי אֲשֶׁר יַעֲבֹדוּ דָּן אָנֹכִי, וְאַחֲרֵי כֵן יֵצְאוּ בִּרְכֻשׁ גָּדוֹל.'],
  [80, 85, 'טז', 'וְדוֹר רְבִיעִי יָשׁוּבוּ הֵנָּה, כִּי לֹא שָׁלֵם עֲוֹן הָאֱמֹרִי עַד הֵנָּה.'],
  [85, 97, 'יז', 'וַיְהִי הַשֶּׁמֶשׁ בָּאָה וַעֲלָטָה הָיָה, וְהִנֵּה תַנּוּר עָשָׁן וְלַפִּיד אֵשׁ אֲשֶׁר עָבַר בֵּין הַגְּזָרִים הָאֵלֶּה.'],
  [97, 108, 'יח', 'בַּיּוֹם הַהוּא כָּרַת ה\' אֶת אַבְרָם בְּרִית לֵאמֹר: לְזַרְעֲךָ נָתַתִּי אֶת הָאָרֶץ הַזֹּאת, מִנְּהַר מִצְרַיִם עַד הַנָּהָר הַגָּדֹל נְהַר פְּרָת.'],
];

/* ---------- timeline ---------- */
// sky palette: [skyTop, skyBottom, duneFar, duneNear, ground]
const PALETTE = [
  [0,  ['#04060f', '#18203c', '#15141f', '#100f18', '#0b0a10']],
  [30, ['#04060f', '#18203c', '#15141f', '#100f18', '#0b0a10']],
  [36, ['#5d97cf', '#f1d9a8', '#d0a868', '#b98c4f', '#a07642']],
  [58, ['#5d97cf', '#f1d9a8', '#d0a868', '#b98c4f', '#a07642']],
  [63, ['#3a2a58', '#ee8a3c', '#7a4630', '#5c3424', '#44261b']],
  [68, ['#060510', '#1a0f1e', '#140c12', '#0f090e', '#0a060a']],
];
const STAR_ALPHA = [[0, 1], [30, 1], [35, 0], [62, 0], [67, .75], [114, .75]];
// how lit the characters are (moonlight → daylight → dusk → darkness)
const LIGHT = [[0, .62], [30, .62], [36, 1], [58, 1], [63, .75], [67, .5]];
// camera: [zoom, focusX, focusY] in world coordinates
const CAM = [
  [0, [1, 640, 478]], [5, [1.05, 760, 470]], [9, [1.4, 1010, 480]], [14, [1.4, 1010, 480]],
  [17, [1.25, 960, 475]], [20.5, [1, 640, 420]], [27, [1, 640, 420]], [29.5, [1.3, 1000, 470]],
  [36, [1, 640, 478]], [52, [1, 640, 478]], [54.5, [1.12, 720, 450]], [59, [1, 640, 478]],
  [63, [1.05, 700, 480]], [67, [1.4, 960, 520]], [86, [1.1, 640, 500]], [96, [1.1, 640, 500]], [97, [1, 640, 478]],
];
// lightning strikes: [time, x (screen), seed]
const BOLTS = [[1.0, 930, 1], [64.2, 300, 2], [65.3, 860, 3], [66.5, 520, 4], [67.6, 1060, 5], [74.8, 330, 8], [85.7, 640, 6], [96.9, 640, 7]];

const R = rng(15);
const STARS = Array.from({ length: 3200 }, () => ({ x: R() * W, y: Math.pow(R(), 1.3) * 540, r: .4 + Math.pow(R(), 3) * 1.8, p: R() * 6.28, s: .5 + R() * 2 }));
const STORM = Array.from({ length: 26 }, (_, i) => ({ x: i * 62 - 200 + R() * 40, y: 20 + R() * 90, r: 60 + R() * 70 }));
const PUFFS = Array.from({ length: 6 }, (_, i) => ({ x: i * 260 + R() * 80, y: 70 + R() * 120, s: .7 + R() * .6 }));
const SAND = Array.from({ length: 140 }, () => ({ x: R() * 1600, y: 300 + R() * 420, v: 140 + R() * 220, r: .8 + R() * 1.6 }));

const GROUND_Y = 572, LANE_Y = 527, ROW_TOP = 447, ROW_BOT = 612;
const ANIMALS = [{ e: '🐄', x: 780 }, { e: '🐐', x: 580 }, { e: '🐏', x: 380 }];

/* ---------- camera ---------- */
let CAMV = [1, 640, 478];
function applyCam() { const [z, fx, fy] = CAMV; ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-fx, -fy); }
const toScreen = (x, y) => [(x - CAMV[1]) * CAMV[0] + W / 2, (y - CAMV[2]) * CAMV[0] + H / 2];

/* ---------- lightning ---------- */
function boltPath(seed, x) {
  const r = rng(seed * 97 + 3);
  let pts = [[x + (r() - .5) * 200, 40], [x, 470]];
  for (let d = 0, off = 90; d < 6; d++, off *= .55) {
    const out = [pts[0]];
    for (let i = 1; i < pts.length; i++) {
      const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
      out.push([(ax + bx) / 2 + (r() - .5) * off, (ay + by) / 2 + (r() - .5) * off * .3], [bx, by]);
    }
    pts = out;
  }
  const branches = [];
  for (let b = 0; b < 3; b++) {
    const s = pts[Math.floor((.2 + r() * .5) * pts.length)], dir = r() < .5 ? -1 : 1;
    let [bx, by] = s; const br = [[bx, by]];
    for (let k = 0; k < 8; k++) { bx += dir * (8 + r() * 16); by += 10 + r() * 14; br.push([bx, by]); }
    branches.push(br);
  }
  return [pts, branches];
}
const BOLT_PATHS = BOLTS.map(([, x, s]) => boltPath(s, x));
function flashAt(t) {
  let f = 0;
  for (const [t0] of BOLTS) { const a = t - t0; if (a >= 0 && a < 1.2) f = Math.max(f, Math.exp(-a * 5) * (a < .07 || (a > .12 && a < .2) ? 1 : .45)); }
  return f;
}
function drawBolts(t) {
  BOLTS.forEach(([t0], i) => {
    const a = t - t0; if (a < 0 || a > .45) return;
    const k = Math.exp(-a * 7) * (a < .06 || (a > .11 && a < .19) ? 1 : .35);
    const [main, branches] = BOLT_PATHS[i];
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineJoin = 'round';
    const stroke = (p, w) => { ctx.lineWidth = w; ctx.beginPath(); p.forEach(([x, y], j) => j ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
    ctx.shadowColor = 'rgba(170,190,255,1)'; ctx.shadowBlur = 30;
    ctx.strokeStyle = `rgba(170,190,255,${.8 * k})`; stroke(main, 7); branches.forEach(b => stroke(b, 3));
    ctx.shadowBlur = 0; ctx.strokeStyle = `rgba(255,255,255,${k})`; stroke(main, 2.2); branches.forEach(b => stroke(b, 1));
    ctx.restore();
  });
}

/* ---------- sky ---------- */
function drawSky(t, pal) {
  const g = ctx.createLinearGradient(0, 0, 0, H * .8);
  g.addColorStop(0, pal[0]); g.addColorStop(1, pal[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const sa = key(STAR_ALPHA, t);
  if (sa > .01) {
    const n = Math.round(lerp(260, STARS.length, ease(prog(t, 21, 26))) * (t > 60 ? .35 : 1));
    ctx.fillStyle = '#fff8e6';
    for (let i = 0; i < n; i++) {
      const s = STARS[i];
      const born = i < 260 ? 1 : clamp((t - 21 - (i / STARS.length) * 5) * 2);
      ctx.globalAlpha = sa * (.55 + .45 * Math.sin(t * s.s + s.p)) * born;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.283); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  // shooting stars while he counts
  for (const [t0, x0, y0] of [[22.3, 1100, 60], [24.1, 700, 30], [25.4, 400, 90]]) {
    const a = t - t0; if (a < 0 || a > .8) continue;
    const x = x0 - a * 700, y = y0 + a * 260, gg = ctx.createLinearGradient(x, y, x + 140, y - 52);
    gg.addColorStop(0, `rgba(255,255,240,${1 - a / .8})`); gg.addColorStop(1, 'rgba(255,255,240,0)');
    ctx.strokeStyle = gg; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 140, y - 52); ctx.stroke();
  }

  // sun
  const sunVis = win(t, 33, 66, 3);
  if (sunVis > 0) {
    const sx = key([[33, 1150], [58, 420], [66, 300]], t), sy = key([[33, 470], [40, 150], [58, 210], [66, 520]], t);
    const sunCol = key([[58, ['#fff4c8']], [64, ['#ff9a3c']]], t)[0];
    const glow = ctx.createRadialGradient(sx, sy, 10, sx, sy, 200);
    glow.addColorStop(0, 'rgba(255,230,160,.55)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
    ctx.globalAlpha = sunVis; ctx.fillStyle = glow; ctx.fillRect(sx - 210, sy - 210, 420, 420);
    ctx.fillStyle = sunCol; ctx.beginPath(); ctx.arc(sx, sy, 42, 0, 6.283); ctx.fill(); ctx.globalAlpha = 1;
  }
  // soft day clouds
  const day = win(t, 35, 61, 3);
  if (day > 0) PUFFS.forEach(p => {
    const x = ((p.x + t * 12) % 1700) - 200;
    ctx.fillStyle = `rgba(255,255,255,${.55 * day})`; ctx.beginPath();
    [[0, 0, 38], [36, -14, 44], [74, 0, 34], [38, 10, 40]].forEach(([dx, dy, r]) => { ctx.moveTo(x + (dx + r) * p.s, p.y + dy * p.s); ctx.arc(x + dx * p.s, p.y + dy * p.s, r * p.s, 0, 6.283); });
    ctx.fill('nonzero');
  });
  // storm clouds, lit from inside by the lightning
  const storm = Math.max(win(t, 60.5, 97.5, 2.5), win(t, 0, 5, 1.2) * .8);
  if (storm > 0) {
    const fl = flashAt(t);
    STORM.forEach((c, i) => {
      const x = c.x + Math.sin(t * .15 + i) * 30 + t * 6 % 60;
      const col = mix('#16131f', '#8d8fb4', fl);
      const gg = ctx.createRadialGradient(x, c.y, 10, x, c.y, c.r);
      gg.addColorStop(0, col); gg.addColorStop(1, 'rgba(10,8,16,0)');
      ctx.globalAlpha = storm * .95; ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(x, c.y, c.r, 0, 6.283); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  drawBolts(t);
}

/* ---------- world ---------- */
function dune(base, amp, col, seed) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-500, H + 300);
  for (let x = -500; x <= W + 500; x += 10) {
    ctx.lineTo(x, base - amp * (Math.sin(x / 210 + seed) * .6 + Math.sin(x / 93 + seed * 2.1) * .25 + Math.sin(x / 460 + seed * .7) * .5));
  }
  ctx.lineTo(W + 500, H + 300); ctx.closePath(); ctx.fill();
}
function drawLand(pal) {
  dune(470, 34, pal[2], 1.3);
  dune(520, 22, pal[3], 4.1);
  ctx.fillStyle = pal[4]; ctx.fillRect(-500, 548, W + 1000, H);
  dune(560, 10, pal[4], 2.2);
}
function drawTent(light) {
  ctx.save(); ctx.filter = `brightness(${light})`;
  ctx.fillStyle = '#3d2a1c';
  ctx.beginPath(); ctx.moveTo(1140, GROUND_Y); ctx.lineTo(1170, 470); ctx.lineTo(1330, 455); ctx.lineTo(1380, GROUND_Y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#5a3f2a';
  for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(1160 + i * 44, GROUND_Y); ctx.lineTo(1175 + i * 32, 468 - i * 3); ctx.lineTo(1186 + i * 32, 467 - i * 3); ctx.lineTo(1178 + i * 44, GROUND_Y); ctx.fill(); }
  ctx.fillStyle = '#140d09'; ctx.beginPath(); ctx.moveTo(1195, GROUND_Y); ctx.lineTo(1225, 492); ctx.lineTo(1255, GROUND_Y); ctx.fill();
  ctx.strokeStyle = '#2a1c12'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(1170, 470); ctx.lineTo(1120, GROUND_Y); ctx.moveTo(1330, 455); ctx.lineTo(1400, GROUND_Y); ctx.stroke();
  ctx.restore();
}

/* ---------- Abram ---------- */
const SKIN = '#e0ad7c', ROBE_A = '#9c6b3c', ROBE_B = '#6c4323', CLOTH = '#eee4cf', BAND = '#8a4f2a';
function sleeve(sx, sy, a, len, w) {
  const hx = sx - Math.sin(a) * len, hy = sy + Math.cos(a) * len;
  ctx.strokeStyle = ROBE_B; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(hx, hy); ctx.stroke();
  ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx - Math.sin(a) * 4, hy + Math.cos(a) * 4, 6.5, 0, 6.283); ctx.fill();
  return [hx, hy];
}
function drawAbramFigure(t, p) {
  const sw = Math.sin(p.walk * Math.PI * 2), bob = -Math.abs(sw) * 3 * p.walking, breathe = Math.sin(t * 1.7) * 1.2;
  ctx.translate(0, bob);
  // feet
  ctx.fillStyle = '#3b2616';
  ctx.beginPath(); ctx.ellipse(-10 + sw * 9 * p.walking, -3, 10, 5, 0, 0, 6.283); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6 - sw * 9 * p.walking, -3, 10, 5, 0, 0, 6.283); ctx.fill();
  // staff arm (behind)
  const hb = sleeve(12, -112, p.armB + Math.sin(t * 9) * .25 * p.shake, 50, 13);
  ctx.strokeStyle = '#5b3a1f'; ctx.lineWidth = 5.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(hb[0] - 2, hb[1] - 104); ctx.lineTo(hb[0] + 2, hb[1] + 66); ctx.stroke();
  ctx.fillStyle = '#5b3a1f'; ctx.beginPath(); ctx.arc(hb[0] - 3, hb[1] - 106, 6, 0, 6.283); ctx.fill();
  // robe

  river([[1130, 80], [1050, 170], [1085, 270], [1005, 380], [1030, 510]], t, 1);
  centerText('נְהַר מִצְרַיִם', 215, 545, 32, '#1d2a4a', SERIF, 900, a);
  centerText('נְהַר פְּרָת', 1030, 545, 32, '#1d2a4a', SERIF, 900, a);
  centerText('לְזַרְעֲךָ נָתַתִּי אֶת הָאָרֶץ הַזֹּאת', W / 2, 305, 56, '#3a220c', SERIF, 900, a * prog(t, 101, 102.5));
  ctx.restore();
  drawRays(t, a * .45 * (1 - prog(t, 101, 103) * .5), W / 2, -60, 1.6);
}

/* ---------- captions & titles ---------- */
function wrap(text, maxW) {
  const words = text.split(' '), lines = []; let line = '';
  for (const w of words) { const test = line ? line + ' ' + w : w; if (ctx.measureText(test).width > maxW && line) { lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
function drawCaption(t) {
  for (const [a, b, v, text] of CAPTIONS) {
    const al = win(t, a, b, .5);
    if (al <= 0) continue;
    ctx.save(); ctx.globalAlpha = al; ctx.direction = 'rtl'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `700 28px ${SERIF}`;
    const lines = wrap(text, 1060), lh = 40, boxH = lines.length * lh + 44, top = H - boxH - 14;
    ctx.fillStyle = 'rgba(8,6,12,.66)'; ctx.beginPath(); ctx.roundRect(70, top, W - 140, boxH, 16); ctx.fill();
    ctx.fillStyle = '#e8bd62'; ctx.font = `700 17px ${SANS}`; ctx.fillText(`בראשית ט"ו, ${v}`, W / 2, top + 16);
    ctx.fillStyle = '#f7efdd'; ctx.font = `700 28px ${SERIF}`;
    lines.forEach((l, i) => ctx.fillText(l, W / 2, top + 42 + i * lh));
    ctx.restore();
  }
}
function drawTitles(t) {
  const a = win(t, .9, 6.2, 1);
  if (a > 0) {
    ctx.fillStyle = `rgba(0,0,0,${.3 * a})`; ctx.fillRect(0, 0, W, H);
    centerText('בְּרִית בֵּין הַבְּתָרִים', W / 2, 270, 96 + prog(t, 1, 6) * 6, '#f1cf82', SERIF, 900, a);
    centerText('בראשית · פרק ט"ו', W / 2, 368, 34, '#f4ead6', SANS, 400, a * prog(t, 1.8, 2.8));
  }
  const e = prog(t, 108, 109.5);
  if (e > 0) {
    ctx.fillStyle = `rgba(6,5,10,${e})`; ctx.fillRect(0, 0, W, H);
    centerText('בְּרִית בֵּין הַבְּתָרִים', W / 2, 300, 80, '#f1cf82', SERIF, 900, e);
    centerText('"בַּיּוֹם הַהוּא כָּרַת ה\' אֶת אַבְרָם בְּרִית"', W / 2, 390, 36, '#f4ead6', SERIF, 700, e * prog(t, 109.2, 110.2));
    centerText('בית המדרש הדיגיטלי · ספר בראשית', W / 2, 470, 22, '#b8a98f', SANS, 400, e * prog(t, 110, 111));
  }
  const f = Math.max(1 - prog(t, 0, .6), prog(t, 112.8, 114));
  if (f > 0) { ctx.fillStyle = `rgba(0,0,0,${f})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- frame ---------- */
function render(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  const pal = key(PALETTE, t);
  CAMV = key(CAM, t);
  // subtle camera shake on the thunder
  const fl = flashAt(t);
  const shake = fl * 6, sx = Math.sin(t * 90) * shake, sy = Math.cos(t * 77) * shake;
  let light = key(LIGHT, t) + fl * .6;
  if (t > 86 && t < 97) light += .5 * clamp(1 - Math.abs(furnacePos(t) + 210 - 640) / 500);

  ctx.translate(sx, sy);
  drawSky(t, pal);
  ctx.save(); applyCam();
  drawLand(pal);
  drawTent(light);
  drawPieces(t, 'top', light);
  drawFire(t);
  drawPieces(t, 'bot', light);
  drawSlashes(t);
  drawAbram(t, light);
  drawEagle(t);
  ctx.restore();
  // "the word of the Lord came to Abram" — light from above onto him
  const [ax] = toScreen(abramPose(t).x, 0);
  drawRays(t, Math.max(win(t, 6.5, 14, 1.5), win(t, 20.5, 27, 1.5) * .6, win(t, 36.5, 45, 1.5) * .5), ax - 40, -80);
  drawSand(t);
  drawDread(t);
  drawVision(t);
  drawPromise(t);
  if (fl > 0) { ctx.fillStyle = `rgba(220,225,255,${fl * .45})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  drawCaption(t);
  drawTitles(t);
}

const fontsReady = Promise.all([
  document.fonts.load(`700 31px "Frank Ruhl Libre"`, 'אבג'),
  document.fonts.load(`900 31px "Frank Ruhl Libre"`, 'אבג'),
  document.fonts.load(`400 20px "Heebo"`, 'אבג'),
  document.fonts.load(`700 20px "Heebo"`, 'אבג'),
]).catch(() => {}).then(() => document.fonts.ready);
window.__render = t => { render(t); return cv.toDataURL('image/jpeg', .9); };
window.__duration = DURATION;
window.__ready = fontsReady.then(() => true);
})();
</script>
