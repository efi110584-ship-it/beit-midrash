<script>
const TOPICS = [
{ key:"s1", name:"הבטחת הזרע", icon:"⭐", color:"#8A5C21",
  qa:[
    ["מה הכוונה במילים \"אחר הדברים האלה\"? לפי רש\"י, ממה חשש אברם אחרי מלחמת המלכים?",
     "אחרי שניצח את ארבעת המלכים ונעשו לו ניסים, אברם חשש שכבר מיצה את זכויותיו בעולם הזה. ה' מרגיע אותו: \"אל תירא\" מעונש, \"אנכי מגן לך\", ו\"שכרך הרבה מאד\" - עוד שכר גדול מחכה לו."],
    ["בפסוקים ב'-ג' חוזרת המילה \"ויאמר אברם\" פעמיים. לפי אברבנאל, מה מלמדת הכפילות, ולמה אברם פונה לה' פעמיים?",
     "הכפילות של \"ויאמר\" מלמדת ששתי הפניות הן שני שלבים נפרדים. תחילה הוא מרמז בביישנות שאין לו יורש (\"מה תתן לי ואנכי הולך ערירי\"). כשה' לא עונה לרמז, הוא נאלץ לשאול פעם שנייה במפורש (\"הן לי לא נתת זרע\")."],
    ["הביאו את שלוש הדרכים שבהן מסביר רש\"י את \"ויוצא אתו החוצה\".",
     "פשט: הוציאו מהאוהל לראות כוכבים. דרש א': צא מהאצטגנינות - שינוי השם ישנה את המזל. דרש ב': הגביהו מעל הכוכבים, ולכן \"הבט\" מלמעלה למטה."],
    ["מי הנושא של \"והאמן\" ומי הנושא של \"ויחשבה\"? מה מיוחד באמונת אברם?",
     "אברם הוא הנושא של \"והאמין\"; ה' הוא הנושא של \"ויחשבה\". ה' החשיב את אמונתו המלאה של אברם - שהאמין בלי לבקש אות - לזכות ולצדקה."],
  ]
},
{ key:"s2", name:'"במה אדע" - בקשת האות וטקס הברית', icon:"🕊️", color:"#3F6E66",
  qa:[
    ["איזה מקום אחר בתורה פותח בלשון דומה ל\"אני ה' אשר הוצאתיך מ...\"?",
     "עשרת הדברות: \"אנכי ה' אלהיך אשר הוצאתיך מארץ מצרים מבית עבדים\". בשני המקומות ה' מזכיר מעשה הצלה לפני הציווי/ההבטחה."],
    ["מה, לפי הרמב\"ן, אברם באמת מבקש כשהוא שואל \"במה אדע כי אירשנה\"?",
     "הוא חושש שמא חטא שלו או של זרעו ימנע את קיום ההבטחה, או שמא הכנענים יחזרו בתשובה. ה' כורת איתו ברית שהארץ תינתן על כל פנים."],
    ["תארו את טקס ברית בין הבתרים. מה עושה העיט, ואיך אברם מגיב?",
     "אברם ביתר את הבהמות וסידר את הבתרים - הציפורים לא ביתר. עיט יורד לטרוף את הפגרים, ואברם מבריח אותו."],
  ]
},
{ key:"s3", name:"סמליות הברית - בהמות מול ציפור", icon:"🦅", color:"#1E2761",
  qa:[
    ["לפי רש\"י, מה מסמלות הבהמות שביתר, ומה מסמלת הציפור שלא ביתר?",
     "הבהמות מסמלות את האומות - עתידות לכלות. הציפור מסמלת את ישראל - שיתקיים לעולם. הרחקת העיט מסמלת דחיית מבקשי כליית ישראל עד הגאולה."],
  ]
},
{ key:"s4", name:"גזירת הגלות והגאולה", icon:"⛓️", color:"#8B4A34",
  qa:[
    ["מהם עיקרי הדברים שה' מודיע לאברם על עתיד זרעו (פסוקים י\"ג-י\"ד)?",
     "זרעו יהיה גֵר בארץ זרה, ישועבד ויעונה 400 שנה - אבל ה' יעניש את האומה המשעבדת, ובני ישראל יצאו ברכוש גדול וישובו בדור הרביעי."],
    ["לפי הרב חנן פורת, למה קשר לא-טבעי הוא הבסיס הנכון לקשר הנצחי בין עם ישראל לארצו?",
     "קשר טבעי עלול להתבטל כשמתנתקים מהארץ, כמו שקרה לעמים אחרים. קשר המבוסס על צו וברית אלוקיים הוא נצחי ואינו תלוי במגורים רצופים."],
  ]
},
{ key:"s5", name:"כריתת הברית - הבטחת הארץ", icon:"🔥", color:"#7A4A73",
  qa:[
    ["מה מסמלים \"תנור עשן ולפיד אש\" שעוברים בין הבתרים?",
     "סמל לנוכחות ה' עצמו שעובר בין הבתרים, כמנהג כורתי ברית באותה תקופה - כך נכרתת הברית עם אברם."],
    ["כמה עמים מוזכרים כיושבי הארץ המובטחת? למה התורה מפרטת אותם בשמם?",
     "עשרה עמים. הפירוט מדגיש שהבטחת הארץ קונקרטית ומוגדרת גיאוגרפית, לא הבטחה כללית."],
    ["אברם לא עובר בין הבתרים - רק \"תנור עשן ולפיד אש\". מה זה מלמד על סוג הברית?",
     "זו ברית חד-צדדית: ה' לבדו מתחייב לתת את הארץ, וההבטחה אינה מותנית במעשיו של אברם."],
  ]
},
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
