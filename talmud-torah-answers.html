<title>מחוון - מצוות תלמוד תורה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--navy:#14284B;--gold:#B7791F;--ink:#1D2433;--mute:#5B6475;--line:#E3DCCB;--bg:#FBF7EE;--ok:#1F6F4A;--okb:#EAF6EF;--t1:#2F6F62;--t2:#B07A2B;--t3:#5B4B8A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 Heebo,Arial,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-family:"Frank Ruhl Libre",serif;color:var(--navy);font-size:1.7rem;margin:4px 0}
.sub{color:var(--mute);margin:0 0 14px}
.gate{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center}
.gate button,.tools button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 18px;background:var(--navy);color:#fff;cursor:pointer}
.gate button:focus-visible,.tools button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.k-topic{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 16px 14px;margin:0 0 16px;border-top:6px solid var(--navy)}
.k-t1{border-top-color:var(--t1)}.k-t2{border-top-color:var(--t2)}.k-t3{border-top-color:var(--t3)}.k-bag{border-top-color:var(--gold)}
.k-topic h2{font-family:"Frank Ruhl Libre",serif;color:var(--navy);font-size:1.35rem;margin:10px 0 6px}
.k-topic h3{font-size:1.02rem;color:var(--navy);margin:14px 0 6px}
.k-tbl{width:100%;border-collapse:collapse;font-size:.95rem}
.k-tbl th,.k-tbl td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:top}
.k-tbl th{background:#F4EEDF}
.k-tbl td:first-child{white-space:nowrap}
.k-a{color:var(--ok);font-weight:500}
td.k-a{background:var(--okb)}
.k-src{color:var(--gold);font-size:.85em}
.k-card{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:0 0 8px}
.k-q{margin:0 0 4px}
.k-card .k-a{background:var(--okb);border-radius:8px;padding:6px 10px;margin:0}
.k-seq{margin:0;padding-inline-start:24px}.k-seq li{margin:2px 0;color:var(--ok)}
.k-note{color:var(--mute);font-size:.9rem;margin:0 0 6px}
.err{color:#B42318;font-weight:700}
@media (max-width:600px){.k-tbl,.k-tbl tbody,.k-tbl tr,.k-tbl td{display:block;width:100%}.k-tbl thead{display:none}.k-tbl tr{border-bottom:2px solid var(--line);margin-bottom:6px}.k-tbl td{border:0}}
@media print{body{background:#fff;padding:0}.gate,.tools{display:none}.k-topic{break-inside:auto;border:1px solid #ccc}.k-card,.k-tbl tr{break-inside:avoid}}
</style>
</head>

    }).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM",iv:u8(BLOB.i)},key,u8(BLOB.c)); })
      .then(function(buf){
        document.getElementById("body").innerHTML=new TextDecoder().decode(buf);
        document.getElementById("gate").hidden=true; document.getElementById("content").hidden=false;
        try{ sessionStorage.setItem(CK,code); sessionStorage.setItem("teacherAreaUnlocked","1"); }catch(e){}
      });
  }
  var saved=""; try{ saved=sessionStorage.getItem(CK)||""; }catch(e){}
  if(saved) tryCode(saved).catch(function(){ try{ sessionStorage.removeItem(CK); }catch(e){} });
  document.getElementById("open").addEventListener("click",function(){
    var c=prompt("הקלידו את קוד המחוונים:"); if(c===null) return;
    var err=document.getElementById("err"); err.textContent="בודק…";
    tryCode(c).then(function(){ err.textContent=""; }).catch(function(){ err.textContent="קוד שגוי. נסו שוב."; });
  });
})();
</script>
