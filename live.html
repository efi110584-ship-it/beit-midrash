<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>פעילות בכיתה | הכיתה הדיגיטלית</title>
<meta name="description" content="פעילות חיה בכיתה - ענן מילים או הצבעה">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B2A5B; --blue:#123A78; --orange:#FF7A1A; --ink:#0E1B33; --muted:#56637A; --line:#DCE4F1; --bg:#EEF3FB; --ok:#0D8A63; --err:#B42318; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:"Heebo","Rubik",Arial,sans-serif; font-size:17px; line-height:1.55; }
  .visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  .skip-link{ position:absolute; top:-60px; inset-inline-start:12px; background:#fff; padding:8px 12px; border-radius:8px; z-index:10; }
  .skip-link:focus{ top:12px; }
  header{ background:var(--navy); color:#fff; padding:14px 16px 18px; }
  .top{ max-width:760px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .top a{ color:#fff; text-decoration:none; font-size:.95rem; opacity:.9; }
  .top a:hover{ text-decoration:underline; }
  .live-tag{ display:inline-flex; align-items:center; gap:7px; padding:3px 12px; border-radius:999px; background:rgba(255,255,255,.14); font-weight:700; font-size:.92rem; }
  .live-tag::before{ content:""; width:9px; height:9px; border-radius:50%; background:#FF5A4E; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.3 } }
  main{ max-width:760px; margin:0 auto; padding:18px 16px 60px; display:flex; flex-direction:column; gap:14px; }
  [hidden]{ display:none !important; }
  .lv-preview{ margin:0; padding:10px 14px; border:1px solid #F3C9A4; border-radius:12px; background:#FFF6EE; color:#5B3A1E; font-size:.95rem; line-height:1.5; }
</style>
<script src="assets/a11y.js"></script>
</head>
<body>
<a class="skip-link" href="#main">דלג לתוכן</a>
<header>
  <div class="top">
    <span class="live-tag">פעילות בכיתה</span>
    <a href="index.html">חזרה לדף הבית ›</a>
  </div>
</header>

<main id="main">
  <p class="lv-preview" id="lvPreview" hidden>👁 <b>תצוגת תלמיד</b> - כך התלמידים רואים את הפעילות. אפשר גם לענות כדי לנסות, והתשובה תיספר בתוצאות בשם שתכתבו.</p>
  <div id="lvMount"></div>
</main>

<script src="assets/bm-api.js"></script>
<script src="assets/live-render.js"></script>
<script src="assets/live-widget.js"></script>
<script>
/* דף התלמיד בפעילות חיה (הכול ב-assets/live-widget.js) */
var lvPreview = new URLSearchParams(location.search).get("preview") === "1";
document.getElementById("lvPreview").hidden = !lvPreview;
window.BM_LIVEWIDGET.mount(document.getElementById("lvMount"), { preview:lvPreview });
</script>
<script src="assets/lesson-mode.js"></script>
<script src="assets/class-dock.js"></script>
</body>
</html>
