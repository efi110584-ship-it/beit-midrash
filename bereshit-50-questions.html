<script>
const TOPICS = [
  {
    "key": "s1",
    "name": "מותו של יעקב וקבורתו",
    "icon": "🕯️",
    "color": "#3E5A8C",
    "qa": [
      [
        "לפי רד\"ק, מדוע בכו המצרים על יעקב שבעים יום? כתבו שתי סיבות.",
        "לכבוד יוסף, בגלל מעמדו הרם; וגם לכבוד יעקב עצמו, ״לפי שנפסק הרעב בעבורו״."
      ],
      [
        "לפי המדרש שמביא רש\"י, מדוע בכו המצרים על יעקב?",
        "״באה להם ברכה לרגלו, שכלה הרעב, והיו מי הנילוס מתברכין״."
      ],
      [
        "תארו את שלושת שלבי האבל על יעקב.",
        "שבעים ימי אבל במצרים; מסע לוויה לארץ כנען, ששיאו ״מספד גדול וכבד מאד״ בגורן האטד; קבורה במערת המכפלה."
      ],
      [
        "מה מלמדים תיאורי האבל על יעקב על מעמדו של יוסף במצרים?",
        "יוסף רם מעלה, אבל אינו חופשי לעזוב את מצרים בלי רשות פרעה."
      ],
      [
        "השוו את מקומם של האחים בשלבי האבל: במסע הלוויה (פסוקים ז'-ח') ובקבורה בארץ (פסוקים י\"ב-י\"ג). מה השתנה?",
        "במסע מודגש יוסף לצד אנשי מצרים. בקבורה כולם ״בניו״, שווים באבל המשפחתי."
      ]
    ]
  },
  {
    "key": "s2",
    "name": "חשש האחים ותגובת יוסף",
    "icon": "😟",
    "color": "#8B4A34",
    "qa": [
      [
        "לפי רד\"ק, ממה חששו האחים אחרי מות יעקב?",
        "שרק מפני יראת אביהם נמנע יוסף מלהרע להם, ועכשיו ״ישיב לנו את כל הרעה אשר גמלנו אותו״."
      ],
      [
        "מה מלמד חשש האחים אחרי מות יעקב על היחסים בינם לבין יוסף?",
        "גם אחרי שנים רבות יחד במצרים הם עדיין חוששים מנקמת יוסף - הפיוס לא היה שלם."
      ],
      [
        "האם יעקב באמת ציווה את הדברים שהאחים אומרים בשמו? הסבירו לפי רש\"י.",
        "לא. האחים שינו למען השלום; יעקב ידע שיוסף לא יפגע בהם."
      ],
      [
        "\"וַיֵּבְךְּ יוֹסֵף בְּדַבְּרָם אֵלָיו\" - מדוע בכה יוסף? כתבו את שני ההסברים.",
        "המדרש: נפגע מחשד אחיו. בכור שור: נכמרו רחמיו עליהם."
      ],
      [
        "אילו שני דברים אומר יוסף לאחיו כדי להרגיע אותם?",
        "״ואתם חשבתם עלי רעה, אלהים חשבה לטובה״; ו״אנכי אכלכל אתכם ואת טפכם״."
      ],
      [
        "לפי רש\"י, מה פירוש ״התחת אלהים אני״?",
        "גם אילו רצה - לא היה יכול להרע להם: כולם חשבו רעה וה׳ הפך אותה לטובה, ״והיאך אני לבדי יכול להרע לכם?״"
      ]
    ]
  },
  {
    "key": "s3",
    "name": "מות יוסף והשבועה",
    "icon": "⚱️",
    "color": "#1E2761",
    "qa": [
      [
        "אילו שני חלקים יש בשבועה שמשביע יוסף את בני ישראל?",
        "ה׳ יפקוד אותם ויעלם לארץ; אז יעלו איתם את עצמות יוסף."
      ]
    ]
  }
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
