<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ספר בראשית — שאלות ותשובות לחזרה (פרק נ׳)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@600;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EE; --card:#FFFFFF; --ink:#2B2419; --ink-soft:#5A5142;
    --navy:#1E2761; --navy-soft:#E7E9F5;
    --gold:#8A5C21; --gold-soft:#F4ECE1;
    --green:#1F7A4D; --green-soft:#E4EEEA;
    --red:#B03A2E; --red-soft:#FBE4E0;
    --border:#E4DACB;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--paper); color:var(--ink); font-family:'Heebo',sans-serif; line-height:1.6; }
  .wrap{ max-width:1100px; margin:0 auto; padding:1.2rem 1.2rem 3rem; }
  header{ text-align:center; padding:1rem 0 .4rem; }
  h1{ font-family:'Frank Ruhl Libre',serif; font-size:2rem; margin:.2rem 0; color:var(--navy); }
  .sub{ color:var(--ink-soft); font-size:1.02rem; margin:0; }

  .breadcrumbs{ max-width:1100px; margin:1rem auto 0; padding:0 1.2rem; font-size:.85rem; color:var(--ink-soft); }
  .breadcrumbs a{ color:var(--navy); text-decoration:none; }
  .breadcrumbs a:hover{ text-decoration:underline; }
  .breadcrumbs .sep{ margin:0 .35rem; color:var(--border); }
  .breadcrumbs .current{ color:var(--ink-soft); }

  .game-nav{ text-align:center; margin:.6rem 0 0; }
  .game-nav a{
    display:inline-flex; align-items:center; gap:.4rem; color:var(--navy); text-decoration:none;
    font-size:.9rem; font-weight:700; border:1.5px solid var(--navy); border-radius:999px; padding:.4rem 1rem;
  }
  .game-nav a:hover{ background:var(--navy-soft); }

  .controls{
    display:flex; align-items:center; justify-content:center; gap:.9rem; flex-wrap:wrap;
    background:var(--card); border:1.5px solid var(--border); border-radius:14px; padding:.85rem 1.1rem; margin:1.2rem 0;
  }
  .ctrl-btn{
    display:inline-flex; align-items:center; gap:.4rem; background:#fff; border:2px solid var(--navy);
    color:var(--navy); border-radius:999px; padding:.5rem 1.1rem; font-weight:700; cursor:pointer;
    font-family:'Heebo',sans-serif; font-size:.9rem;
  }
  .ctrl-btn:hover{ background:var(--navy-soft); }
  .revealed-stat{ font-weight:800; color:var(--navy); font-size:.95rem; }

  .topic-heading{
    display:flex; align-items:center; gap:.6rem; margin:1.6rem 0 .8rem;
    font-family:'Frank Ruhl Libre',serif; font-weight:800; font-size:1.25rem; color:var(--navy);
    border-right:5px solid var(--acc, var(--navy)); padding-right:.6rem;
  }
  .topic-heading .icon{ font-size:1.4rem; }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1rem; }
  .flip-card{ perspective:1200px; height:200px; }
  .flip-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.4,0,.2,1);
    transform-style:preserve-3d; cursor:pointer;
  }
  .flip-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-front, .flip-back{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:14px; padding:1rem;
    display:flex; align-items:center; justify-content:center; text-align:center; font-size:.92rem;
    box-shadow:0 3px 10px rgba(0,0,0,.08); overflow-y:auto;
  }
  .flip-front{ background:var(--card); border:2px solid var(--border); color:var(--ink); font-weight:700; }
  .flip-back{ background:var(--green-soft); border:2px solid var(--green); color:#1D3F37; transform:rotateY(180deg); }
  .flip-hint{ position:absolute; bottom:.35rem; left:0; right:0; text-align:center; font-size:.66rem; color:var(--ink-soft); opacity:.8; }
  .flip-card:focus-visible .flip-inner{ outline:3px solid var(--navy); outline-offset:2px; }

  .site-footer{ text-align:center; color:var(--ink-soft); font-size:.85rem; margin-top:2rem; }

  .to-top-btn{
    position:fixed; bottom:1.2rem; left:1.2rem; width:2.8rem; height:2.8rem; border-radius:50%;
    background:var(--navy); color:#fff; border:none; font-size:1.2rem; cursor:pointer; opacity:0;
    pointer-events:none; transition:opacity .2s ease; box-shadow:0 3px 10px rgba(0,0,0,.2);
  }
  .to-top-btn.show{ opacity:1; pointer-events:auto; }
</style>
</head>
<body>

<nav class="breadcrumbs" aria-label="נתיב ניווט">
  <a href="index.html">בית המדרש הדיגיטלי</a>
  <span class="sep">›</span>
  <a href="index.html#tab-ya">כיתה י"א</a>
  <span class="sep">›</span>
  <a href="index.html#tab-ya">ספר בראשית</a>
  <span class="sep">›</span>
  <a href="bereshit-50.html">פרק נ׳</a>
  <span class="sep">›</span>
  <span class="current">שאלות ותשובות לחזרה</span>
</nav>

<div class="wrap">

  <header>
    <h1>📝 ספר בראשית פרק נ׳ — שאלות ותשובות לחזרה</h1>
    <p class="sub">לחצו על כרטיסייה כדי להפוך אותה ולראות את התשובה. אפשר לערבב את הסדר ולתרגל שוב ושוב.</p>
  </header>

  <div class="game-nav"><a href="bereshit-50.html">→ חזרה לדף העבודה - פרק נ׳</a></div>

  <div class="controls">
    <span class="revealed-stat"><span id="revealedCount">0</span> / <span id="totalCount">0</span> נחשפו</span>
    <button class="ctrl-btn" id="shuffleBtn" type="button">🔀 ערבבו את הסדר</button>
    <button class="ctrl-btn" id="resetBtn" type="button">↺ הפכו הכל בחזרה</button>
  </div>

  <div id="deckArea"></div>

</div>

<button id="toTopBtn" class="to-top-btn" aria-label="חזרה לראש העמוד" title="חזרה לראש העמוד" type="button">&#8593;</button>

<footer class="site-footer">ספר בראשית · פרק נ׳ · שאלות ותשובות לחזרה</footer>

<script>
const TOPICS = [
{
"key": "s1",
"name": "אבלות מצרים על יעקב, וקבורתו בארץ ישראל",
"icon": "🎗️",
"color": "#3E5A8C",
"qa": [
[
"לפי רש\"י, מדוע בוכים דווקא המצרים - ולא רק בני משפחתו - על מות יעקב שבעים יום?",
"לפי רש\"י, המצרים בוכים על יעקב לכבוד יוסף, מפני שבזכות בואו של יעקב למצרים כלה הרעב ובאה ברכה לארץ. הדבר מלמד שמעמד יוסף ומשפחתו במצרים היה רם ומוערך מאוד."
],
[
"תארו את שלושת שלבי האבל על יעקב. מה משותף לכל שלושת השלבים מבחינת גודל הכבוד?",
"שלב א' - שבעים ימי אבל במצרים. שלב ב' - מסע הלוויה, עם מספד גדול וכבד בגורן האטד. שלב ג' - הקבורה עצמה במערת המכפלה. בכל שלושת השלבים ניכר כבוד יוצא דופן ליעקב."
]
]
},
{
"key": "s2",
"name": "חשש האחים ותגובת יוסף",
"icon": "🤝",
"color": "#8B4A34",
"qa": [
[
"לפי רש\"י, האם יעקב באמת ציווה את הציווי שהאחים מייחסים לו? מה ניתן ללמוד על גבולות \"השינוי מפני השלום\"?",
"לפי רש\"י, יעקב מעולם לא ציווה זאת - כי לא רצה שיוסף ייחשד כמי שעלול לנקום באחיו. האחים בדו את הציווי מפני חששם. ניתן ללמוד שמותר לשנות מהאמת כדי לשמור על שלום, אך יש להיזהר שלא לנצל זאת לרעה."
],
[
"כיצד עונה יוסף לחשש האחים? הסבירו את שתי הטענות בתשובתו - \"התחת אלוקים אני\" ו\"אלוקים חשבה לטובה\".",
"\"התחת אלוקים אני\" - יוסף אומר שאין לו סמכות לשפוט במקום אלוקים. \"אלוקים חשבה לטובה\" - יוסף רואה בכל השתלשלות האירועים תוכנית אלוקית שהובילה להצלת עם רב מרעב."
]
]
},
{
"key": "s3",
"name": "מות יוסף והשבועה על העצמות",
"icon": "💀",
"color": "#1E2761",
"qa": [
[
"מדוע, לדעתכם, חשוב ליוסף להשביע דווקא שבועה על העלאת עצמותיו, ולא להסתפק בכך שנקבר בכבוד במצרים?",
"יוסף רוצה להביע אמונה מלאה שהגאולה העתידית תתקיים בוודאות, ושהשהות במצרים זמנית בלבד. בכך הוא קושר את עצמו ואת עתידו לגורל העם כולו."
],
[
"השוו בין השבועה שהשביע יעקב את יוסף (פרק מ\"ז) לשבועה שמשביע יוסף את אחיו כאן.",
"דמיון: בשני המקרים אב זקן משביע את בניו לדאוג לגופתו ולקושרה לארץ ישראל. שוני: את יעקב ניתן היה לקבור מיד בארץ כנען, ואילו עצמות יוסף יישארו במצרים שנים ארוכות עד הגאולה."
]
]
}
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

function makeCard(q, a){
  const card = document.createElement("div");
  card.className = "flip-card";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.setAttribute("aria-label", "כרטיסייה - לחצו כדי להפוך");
  card.innerHTML =
    '<div class="flip-inner">' +
      '<div class="flip-front">' + q + '<span class="flip-hint">לחצו להפוך</span></div>' +
      '<div class="flip-back"><b>✓ </b>' + a + '</div>' +
    '</div>';
  function toggle(){
    card.classList.toggle("flipped");
    updateRevealedCount();
  }
  card.addEventListener("click", toggle);
  card.addEventListener("keydown", (e) => {
    if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); }
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => c.classList.remove("flipped"));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
</body>
</html>
