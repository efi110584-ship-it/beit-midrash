<style>
  .bg-wrap{ max-width:1180px; margin:0 auto; padding:0 1rem; }
  .bg-stats{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.8rem; margin:1.2rem 0 1.6rem; }
  .bg-stat{ background:var(--paper-card); border:1px solid var(--paper-line); border-top:4px solid var(--acc); border-radius:10px; padding:.9rem 1rem; text-align:center; box-shadow:var(--shadow); }
  .bg-stat .n{ font-family:'Frank Ruhl Libre',serif; font-weight:900; font-size:1.7rem; color:var(--ink); display:block; }
  .bg-stat .l{ font-size:.8rem; color:var(--ink-soft); margin-top:.15rem; }
  .bg-stat.combat{ border-top-color:#8B4A34; }
  .bg-stat.combat .n{ color:#8B4A34; }

  .bg-panel{ background:var(--paper-card); border:1px solid var(--paper-line); border-radius:10px; padding:1rem 1.1rem; margin-bottom:1.4rem; box-shadow:var(--shadow); }
  .bg-panel h2{ font-family:'Frank Ruhl Libre',serif; font-size:1.15rem; margin:0 0 .8rem; color:var(--ink); }

  .bg-filters{ display:flex; flex-wrap:wrap; gap:.6rem; align-items:end; margin-bottom:.9rem; }
  .bg-filter{ display:flex; flex-direction:column; gap:.25rem; font-size:.8rem; color:var(--ink-soft); }
  .bg-filter select, .bg-filter input[type="text"]{ font-family:inherit; font-size:.9rem; padding:.4rem .55rem; border:1px solid var(--paper-line); border-radius:7px; background:#fff; min-width:9rem; }
  .bg-filter.grow input{ min-width:14rem; }
  .bg-check{ display:flex; align-items:center; gap:.4rem; font-size:.85rem; padding-bottom:.45rem; }
  .bg-count{ font-size:.82rem; color:var(--ink-soft); margin-bottom:.5rem; }

  .bg-table-wrap{ overflow-x:auto; }
  table.bg-table{ width:100%; border-collapse:collapse; font-size:.82rem; min-width:820px; }
  table.bg-table th, table.bg-table td{ border:1px solid var(--paper-line); padding:.45rem .55rem; text-align:center; vertical-align:top; }
  table.bg-table thead th{ background:var(--acc-soft); color:var(--ink); font-weight:700; cursor:pointer; user-select:none; white-space:nowrap; }
  table.bg-table thead th:hover{ background:var(--gold-soft); color:#fff; }
  table.bg-table td.name{ text-align:right; font-weight:600; white-space:nowrap; }
  table.bg-table td.detail, table.bg-table td.work{ text-align:right; }
  table.bg-table tbody tr:nth-child(even){ background:rgba(0,0,0,.02); }
  .badge{ display:inline-block; padding:.1rem .5rem; border-radius:999px; font-size:.72rem; font-weight:700; }
  .badge.yes{ background:#F1E2DA; color:#8B4A34; }
  .badge.no{ background:transparent; color:var(--ink-soft); }
  .status-chip{ display:inline-block; padding:.15rem .5rem; border-radius:999px; font-size:.75rem; font-weight:600; white-space:nowrap; }
  .status-service{ background:#E4EEEA; color:#3F6E66; }
  .status-national{ background:#F3E7D2; color:#8A5C21; }
  .status-none{ background:#F1E2DA; color:#8B4A34; }
  .status-future{ background:#EAEAF5; color:#4B4B8A; }
  .status-unknown{ background:#EEE; color:#777; }

  .bg-sub-table{ width:100%; border-collapse:collapse; font-size:.82rem; margin-top:.6rem; }
  .bg-sub-table th, .bg-sub-table td{ border:1px solid var(--paper-line); padding:.5rem .6rem; text-align:right; vertical-align:top; }
  .bg-sub-table thead th{ background:var(--acc-soft); color:var(--ink); font-weight:700; text-align:center; }
  .bg-names-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:.4rem .8rem; margin-top:.5rem; }
  .bg-names-grid span{ font-size:.85rem; padding:.25rem .1rem; border-bottom:1px dashed var(--paper-line); }
  .bg-note{ font-size:.82rem; color:var(--ink-soft); line-height:1.6; background:#F3E7D2; border-right:3px solid var(--gold); border-radius:6px; padding:.6rem .85rem; margin-bottom:1rem; }

  .bg-tabs{ display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
  .bg-tab-btn{ font-family:inherit; font-size:.88rem; font-weight:600; padding:.5rem 1rem; border-radius:999px; border:1.5px solid var(--paper-line); background:#fff; color:var(--ink); cursor:pointer; }
  .bg-tab-btn[aria-selected="true"]{ background:var(--acc); color:#fff; border-color:var(--acc); }
  .bg-tabpanel[hidden]{ display:none; }
</style>

<script>
(function(){
  "use strict";
  var TEACHER_CODE = "5703531";
  var gateBtn = document.getElementById("bgGateBtn");
  var gatedContent = document.getElementById("bgGatedContent");
  var ROSTER = null;

  function isTeacherUnlocked(){
    try{ return sessionStorage.getItem("teacherAreaUnlocked") === "1"; }
    catch(e){ return false; }
  }

  function escapeHtml(str){
    return String(str || "").replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function b64ToUtf8(b64){
    var binary = window.atob(b64);
    var bytes = new Uint8Array(binary.length);
    for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return new TextDecoder("utf-8").decode(bytes);
  }

  var MACHZOR_ORDER = ["א","ב","ג","ד","ה","ו","ז","ח","ט"];
  var STATUS_CLASS = {
    "משרת/ת כעת בצה\"ל": "status-service",
    "סיים/ה שירות צבאי": "status-service",
    "סיים/ה שירות צבאי (במילואים)": "status-service",
    "משרת/ת כעת בשירות לאומי": "status-national",
    "סיים/ה שירות לאומי": "status-national",
    "מכינה קדם-צבאית": "status-future",

    "טרם התגייס/לא התגייס": "status-future",
    "פטור": "status-none",
    "לא שירת/ה": "status-none",
    "לא ידוע": "status-unknown",
    "אחר": "status-unknown"
  };

  function statusChip(s){
    var cls = STATUS_CLASS[s] || "status-unknown";
    return '<span class="status-chip ' + cls + '">' + escapeHtml(s) + '</span>';
  }

  function formatDob(iso){
    if(!iso) return "-";
    var parts = iso.split("-");
    if(parts.length !== 3) return escapeHtml(iso);
    return escapeHtml(parts[2] + "/" + parts[1] + "/" + parts[0]);
  }

    html += '<button type="button" class="bg-tab-btn" role="tab" aria-selected="false" data-tab="plan" id="bgTab-plan">תוכנית עבודה</button>';
    html += '<button type="button" class="bg-tab-btn" role="tab" aria-selected="false" data-tab="beitmidrash" id="bgTab-beitmidrash">בית מדרש בוגרים</button>';
    html += '<button type="button" class="bg-tab-btn" role="tab" aria-selected="false" data-tab="sparks" id="bgTab-sparks">ניצוצות בוגרים</button>';
    html += '</nav>';

    html += '<section class="bg-tabpanel" id="bgPanel-roster" role="tabpanel" aria-labelledby="bgTab-roster">';
    html += '<div id="bgStats" class="bg-stats"></div>';
    html += '<div class="bg-panel">';
    html += '<h2>סינון וחיפוש</h2>';
    html += '<div class="bg-filters">';
    html += '<div class="bg-filter"><label for="fMachzor">מחזור</label><select id="fMachzor"><option value="">הכל</option></select></div>';
    html += '<div class="bg-filter"><label for="fGender">מגדר</label><select id="fGender"><option value="">הכל</option><option value="M">בנים</option><option value="F">בנות</option></select></div>';
    html += '<div class="bg-filter"><label for="fStatus">סטטוס שירות</label><select id="fStatus"><option value="">הכל</option></select></div>';
    html += '<div class="bg-filter"><label for="fEdu">השכלה</label><select id="fEdu"><option value="">הכל</option></select></div>';
    html += '<div class="bg-check"><input type="checkbox" id="fCombat"><label for="fCombat">קרבי בלבד</label></div>';
    html += '<div class="bg-filter grow"><label for="fSearch">חיפוש לפי שם</label><input type="text" id="fSearch" placeholder="הקלידו שם..."></div>';
    html += '</div>';
    html += '<div class="bg-count" id="bgCount"></div>';
    html += '<div class="bg-table-wrap"><table class="bg-table" id="bgTable">';
    html += '<thead><tr>';
    html += '<th data-key="m">מחזור</th><th data-key="n">שם</th><th data-key="g">מגדר</th><th data-key="b">תאריך לידה</th><th data-key="s">סטטוס שירות</th><th data-key="d">פרטי שירות</th><th data-key="c">קרבי</th><th data-key="e">השכלה</th><th data-key="w">עיסוק נוכחי</th><th data-key="sr">הערות</th>';
    html += '</tr></thead><tbody id="bgTbody"></tbody>';
    html += '</table></div>';
    html += '</div>';
    html += '</section>';

    html += '<section class="bg-tabpanel" id="bgPanel-plan" role="tabpanel" aria-labelledby="bgTab-plan" hidden></section>';
    html += '<section class="bg-tabpanel" id="bgPanel-beitmidrash" role="tabpanel" aria-labelledby="bgTab-beitmidrash" hidden></section>';
    html += '<section class="bg-tabpanel" id="bgPanel-sparks" role="tabpanel" aria-labelledby="bgTab-sparks" hidden></section>';

    gatedContent.innerHTML = html;
  }

  function fillSelect(id, values){
    var sel = document.getElementById(id);
    values.forEach(function(v){
      var opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      sel.appendChild(opt);
    });
  }

  var state = { sortKey: "m", sortDir: 1 };

  function applyFilters(){
    var m = document.getElementById("fMachzor").value;
    var g = document.getElementById("fGender").value;
    var s = document.getElementById("fStatus").value;
    var e = document.getElementById("fEdu").value;
    var combatOnly = document.getElementById("fCombat").checked;
    var q = document.getElementById("fSearch").value.trim();

    var rows = ROSTER.filter(function(r){
      if(m && r.m !== m) return false;
      if(g && r.g !== g) return false;
      if(s && r.s !== s) return false;
      if(e && r.e !== e) return false;
      if(combatOnly && !r.c) return false;
      if(q && r.n.indexOf(q) === -1) return false;
      return true;
    });

    rows.sort(function(a, b){
      var av = a[state.sortKey], bv = b[state.sortKey];
      if(state.sortKey === "m"){
        av = MACHZOR_ORDER.indexOf(av); bv = MACHZOR_ORDER.indexOf(bv);
      } else if(state.sortKey === "c"){
        av = av ? 1 : 0; bv = bv ? 1 : 0;
      }
      if(av < bv) return -1 * state.sortDir;
      if(av > bv) return 1 * state.sortDir;
      return 0;
    });

    renderRows(rows);
    document.getElementById("bgCount").textContent =
      "מציג " + rows.length + " מתוך " + ROSTER.length + " בוגרים";
  }

  function renderRows(rows){
    var tbody = document.getElementById("bgTbody");
    var html = "";
    rows.forEach(function(r){
      html += "<tr>";
      html += "<td>" + escapeHtml(r.m) + "</td>";
      html += '<td class="name">' + escapeHtml(r.n) + "</td>";
      html += "<td>" + (r.g === "M" ? "בן" : r.g === "F" ? "בת" : "") + "</td>";
      html += "<td>" + formatDob(r.b) + "</td>";
      html += "<td>" + statusChip(r.s) + "</td>";
      html += '<td class="detail">' + escapeHtml(r.d) + "</td>";
      html += "<td>" + (r.c ? '<span class="badge yes">קרבי</span>' : '<span class="badge no">-</span>') + "</td>";
      html += "<td>" + escapeHtml(r.e) + "</td>";
      html += '<td class="work">' + escapeHtml(r.w) + "</td>";
      var notes = [r.sr, r.ed].filter(Boolean).join(" · ");
      html += "<td>" + escapeHtml(notes) + "</td>";
      html += "</tr>";
    });
    tbody.innerHTML = html || '<tr><td colspan="10" style="color:var(--ink-soft); padding:1.2rem;">אין תוצאות התואמות לסינון</td></tr>';
  }

  function renderStats(){
    var total = ROSTER.length;
    var boys = ROSTER.filter(function(r){ return r.g === "M"; }).length;
    var girls = ROSTER.filter(function(r){ return r.g === "F"; }).length;
    var combat = ROSTER.filter(function(r){ return r.c; }).length;
    var activeArmy = ROSTER.filter(function(r){ return r.s === "משרת/ת כעת בצה\"ל"; }).length;
    var doneArmy = ROSTER.filter(function(r){ return r.s.indexOf("סיים/ה שירות צבאי") === 0; }).length;
    var nationalService = ROSTER.filter(function(r){ return r.s.indexOf("שירות לאומי") !== -1; }).length;
    var studying = ROSTER.filter(function(r){ return r.e === "לומד/ת לתואר ראשון" || r.e === "סיים/ה תואר ראשון"; }).length;
    var exempt = ROSTER.filter(function(r){ return r.s === "פטור"; }).length;

    var tiles = [
      { n: total, l: "סה\"כ בוגרים" },
      { n: boys + " / " + girls, l: "בנים / בנות" },
      { n: activeArmy, l: "משרתים כעת בצה\"ל" },
      { n: doneArmy, l: "סיימו שירות צבאי" },
      { n: nationalService, l: "שירות לאומי (כעת/הושלם)" },
      { n: exempt, l: "פטורים" },
      { n: studying, l: "לומדים/סיימו תואר ראשון" },
      { n: combat, l: "קרבי", cls: " combat" }
    ];
    var html = "";
    tiles.forEach(function(t){
      html += '<div class="bg-stat' + (t.cls || "") + '"><span class="n">' + escapeHtml(String(t.n)) + '</span><span class="l">' + escapeHtml(t.l) + "</span></div>";
    });
    document.getElementById("bgStats").innerHTML = html;
  }

  function uniqueSorted(arr){
    var seen = {}; var out = [];
    arr.forEach(function(v){ if(v && !seen[v]){ seen[v] = true; out.push(v); } });
    return out;
  }

  function wireTable(){
    fillSelect("fMachzor", MACHZOR_ORDER.filter(function(m){ return ROSTER.some(function(r){ return r.m === m; }); }));
    fillSelect("fStatus", uniqueSorted(ROSTER.map(function(r){ return r.s; })).sort());
    fillSelect("fEdu", uniqueSorted(ROSTER.map(function(r){ return r.e; })).sort());

    ["fMachzor","fGender","fStatus","fEdu"].forEach(function(id){
      document.getElementById(id).addEventListener("change", applyFilters);
    });
    document.getElementById("fCombat").addEventListener("change", applyFilters);
    document.getElementById("fSearch").addEventListener("input", applyFilters);

    document.querySelectorAll("#bgTable thead th").forEach(function(th){
      th.addEventListener("click", function(){
        var key = th.dataset.key;
        if(state.sortKey === key){ state.sortDir *= -1; }
        else { state.sortKey = key; state.sortDir = 1; }
        applyFilters();
      });
    });

    applyFilters();
  }

  function wireTabs(){
    var tabs = ["roster","plan","beitmidrash","sparks"];
    tabs.forEach(function(name){
      document.getElementById("bgTab-" + name).addEventListener("click", function(){
        tabs.forEach(function(other){
          document.getElementById("bgTab-" + other).setAttribute("aria-selected", other === name ? "true" : "false");
          document.getElementById("bgPanel-" + other).hidden = other !== name;
        });
      });
    });
  }

  function renderPlan(){
    var html = '<div class="bg-panel"><h2>תוכנית עבודה - 11 תחומים אסטרטגיים</h2>';
    html += '<table class="bg-sub-table"><thead><tr><th>תחום</th><th>קהל יעד</th><th>שלבי ביצוע</th><th>לו"ז</th><th>מדדי הצלחה ושותפים</th></tr></thead><tbody>';
    PLAN_ROWS.forEach(function(r){
      html += "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td><td>" + r[2] + "</td><td>" + r[3] + "</td><td>" + r[4] + "</td></tr>";
    });
    html += "</tbody></table></div>";
    document.getElementById("bgPanel-plan").innerHTML = html;
  }

  function renderBeitMidrash(){
    var html = '<div class="bg-panel"><h2>בית מדrash בוגרים - רשימת משתתפים</h2><div class="bg-names-grid">';
    BEIT_MIDRASH_NAMES.forEach(function(n){ html += "<span>" + escapeHtml(n) + "</span>"; });
    html += "</div></div>";
    document.getElementById("bgPanel-beitmidrash").innerHTML = html.replace("מדrash", "מדרש");
  }

  function renderSparks(){
    var html = '<div class="bg-panel"><h2>ניצוצות בוגרים - סיפורי הצלחה</h2>';
    html += '<table class="bg-sub-table"><thead><tr><th>נושא</th><th>בוגר</th></tr></thead><tbody>';
    SPARKS_ROWS.forEach(function(r){
      html += "<tr><td>" + escapeHtml(r[0]) + "</td><td>" + escapeHtml(r[1]) + "</td></tr>";
    });
    html += "</tbody></table></div>";
    document.getElementById("bgPanel-sparks").innerHTML = html;
  }

  function unlockContent(){
    if(!ROSTER){
      ROSTER = JSON.parse(b64ToUtf8(ROSTER_B64));
    }
    gatedContent.hidden = false;
    buildGatedUI();
    renderStats();
    wireTable();
    wireTabs();
    renderPlan();
    renderBeitMidrash();
    renderSparks();
  }

  if(gateBtn && gatedContent){
    if(isTeacherUnlocked()){
      document.addEventListener("DOMContentLoaded", function(){
        unlockContent();
        gateBtn.textContent = "🔓 הקוד אושר";
        gateBtn.disabled = true;
      });
    }
    gateBtn.addEventListener("click", function(){
      var code = prompt("הקלידו את הקוד שקיבלתם מהמורה כדי לפתוח את הנתונים:");
      if(code === null) return;
      if(code.trim() === TEACHER_CODE){
        try{ sessionStorage.setItem("teacherAreaUnlocked", "1"); }catch(e){}
        unlockContent();
        gateBtn.textContent = "🔓 הקוד אושר";
        gateBtn.disabled = true;
      } else {
        alert("קוד שגוי. נסו שוב, או שאלו את המורה.");
      }
    });
  }
})();
</script>

תי. KPI: צוות 5-10 בוגרים מלווים במלואו."], ["<b>7. תרבות ואירועי שיא חברתיים</b><br>יצירת \"אתוס\" וגאוות יחידה דרך מפגשים גדולים החוצים שנתונים.", "כלל הבוגרים.", "צוות היגוי נציגים; תכנון 3 אירועי עוגן; שיווק רוחבי.", "תשרי: פתיחת שנה. כסלו: חנוכה. אייר: על האש.", "שותפים: ועד בוגרים מייסד. KPI: 40+ משתתפים לאירוע; תקציב 60,000 ₪."], ["<b>8. מניעת נשירה ממסגרות ההמשך</b><br>זיהוי מוקדם והתערבות במשברים למניעת הידרדרות.", "תלמידי י\"ב לקראת סיום + שנתון ראשון בשירות/ישיבה.", "ישיבת חפיפה עם יועצת י\"ב; \"בדיקת דופק\" טלפונית רבעונית; התערבות אקטיבית במשבר.", "מאי: מיפוי. נובמבר/מרץ/יולי: ביקורת.", "שותפים: קב\"ס עירוני, יועצת ביה\"ס. KPI: שיפור 10% בהתמדה."], ["<b>9. חונכות והתנדבות (אח בוגר)</b><br>מודל \"העברת המקל\" - בוגרים תורמים לקידום תלמידי התיכון.", "בוגרים באקדמיה או שנתונים 3-5.", "איתור 5 בוגרים חונכים; התאמה לתלמידים מתקשים; מעקב מפגשים.", "אוקטובר: חיבור. נובמבר-יוני: 15 מפגשים.", "שותפים: צוות התיכון. KPI: 15 שיעורים ע\"י 5 בוגרים."], ["<b>10. אקדמיה, פסיכומטרי והכוון</b><br>סיוע בהשתלבות אזרחית - מידע ללימודים, שיפור ציונים, מלגות.", "חיילים משוחררים + לקראת שחרור (שנתונים 2-4).", "חוברת מידע על מלגות; קשר עם מכוני פסיכומטרי; קול קורא לקורסי הכנה.", "מרץ-אפריל: מלגות. מאי-אוגוסט: קורסים.", "שותפים: מרכזי צעירים, מכוני הכנה. KPI: ליווי 15 בוגרים לפחות."], ["<b>11. תכנון, הערכה ופיתוח מודל</b><br>למידה ארגונית להפיכת התוכנית למודל ארצי מוביל.", "צוות ההיגוי הפנימי.", "סיורי למידת עמיתים; פגישות עבודה עם הרכזת הפדגוגית; גיבוש נהלים.", "מרץ-אפריל 2026: סיורים. יוני 2026: סיכום מודל.", "שותפים: רכזת פדגוגית, מנהלת. KPI: מסמך \"מודל קהילת בוגרים\" עד סוף השנה."]];
