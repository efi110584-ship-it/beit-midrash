<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>המטלה נשלחה | בית המדרש הדיגיטלי</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink: #16233F;
  --ink-2: #223256;
  --paper: #FBF7EE;
  --paper-card: #FFFFFF;
  --paper-2: #F1EADA;
  --gold: #A87424;
  --teal: #285C58;
  --text: #23283A;
  --text-soft: #545B72;
  --border: #E3DCC9;
  --focus: #1857C4;
  --radius: 10px;
  --font-display: "Frank Ruhl Libre", "David Libre", serif;
  --font-body: "Heebo", "Arial Hebrew", sans-serif;
}
*, *::before, *::after{ box-sizing:border-box; }
body{
  margin:0; min-height:100vh;
  background:var(--paper); color:var(--text);
  font-family:var(--font-body); line-height:1.6;
  display:flex; align-items:center; justify-content:center;
}
a{ color:var(--gold); }
a:focus-visible{ outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
.card{
  max-width:480px; margin:1.5rem; text-align:center;
  background:var(--paper-card); border:1px solid var(--border); border-radius:var(--radius);
  padding:2.5rem 2rem; box-shadow:0 1px 3px rgba(22,35,63,0.06);
}
.check{
  width:64px; height:64px; margin:0 auto 1.2rem; border-radius:50%;
  background:var(--paper-2); display:flex; align-items:center; justify-content:center;
}
h1{ font-family:var(--font-display); color:var(--ink); font-size:1.5rem; margin:0 0 0.7rem; }
p{ color:var(--text-soft); margin:0 0 1.5rem; }
.back-link{
  display:inline-block; background:var(--ink); color:#fff !important; text-decoration:none;
  font-weight:600; padding:0.7rem 1.4rem; border-radius:8px;
}
.back-link:hover{ background:var(--gold); }
</style>
</head>
<body>

<div class="card">
  <div class="check" aria-hidden="true">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#285C58" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
  <h1>המטלה נשלחה בהצלחה!</h1>
  <p>הקובץ הגיע ישירות למורה. אפשר לסגור את הדף הזה.</p>
  <a class="back-link" href="index.html">חזרה לאתר</a>
</div>

</body>
</html>
