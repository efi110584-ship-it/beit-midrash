<script>
const TOPICS = [
{ key:"s1", name:'"הִתְהַלֵּךְ לְפָנַי וֶהְיֵה תָמִים"', icon:"🚶", color:"#8A5C21",
  qa:[
    ["בן כמה היה אברם כשה' נגלה אליו? באיזה שם מכנה ה' את עצמו, ומה הוא מבקש?",
     "בן תשעים ותשע שנה. ה' מכנה עצמו \"אל שדי\", ומבקש מאברהם להתהלך לפניו ולהיות תמים - לעבוד את ה' בשלמות ובנאמנות מלאה."],
    ["מה מוסיף מדרש תנחומא בהבנת \"התהלך לפני\"?",
     "מדמה זאת לזקנים ההולכים לפני הנשיא ומודיעים את כבודו. כך האבות הלכו לפני ה' והודיעו בעולם את כבודו - עם ישראל נדרש לייצג את דרך ה'."],
    ["איך מחלקים את פרק י\"ז לפי המסגרת שלו?",
     "המסגרת: \"וירא ה' אל אברם ויאמר אליו\" (א') - \"ויכל לדבר אתו ויעל אלהים מעל אברהם\" (כ\"ב). חלק ראשון (א'-כ\"ב): דברי ה' לאברהם. חלק שני (כ\"ג-כ\"ז): אברהם מקיים את הציווי."],
  ]
},
{ key:"s2", name:"ברית המילה - הציווי ומשמעותו", icon:"✂️", color:"#3F6E66",
  qa:[
    ["מהם עיקרי ציווי ברית המילה - את מי מלים, מתי, ולכמה זמן?",
     "כל זכר - יליד בית או מקנת כסף - את ערלת הבשר, ביום השמיני ללידתו, לדורות עולם."],
    ["לפי ספר החינוך, מה מסמל הציווי למול איבר בגוף?",
     "ה' הותיר את גוף האדם חסר, כדי לרמוז שכשם שבידו להשלים את גופו, כך בידו להשלים גם את נפשו - האדם אחראי לתיקון עצמי."],
    ["מה קורה למי שלא נימול, ואילו ביטויים מדגישים שזו מצווה נצחית?",
     "\"ונכרתה הנפש ההוא מעמיה\" (כרת). הביטויים \"לדרתיכם\" ו\"ברית עולם\" מדגישים שזו מצווה לדורי דורות."],
    ["איזו מילה מנחה חוזרת בפסוקים ט'-י\"ד, ומהו \"אות\"?",
     "\"ברית\" - שש פעמים בפסוקים ט'-י\"ד (ועוד ארבע בפסוקים א'-ח'). המילה היא \"אות ברית\" - סימן פיזי וקבוע בגוף, \"לברית עולם\"."],
  ]
},
{ key:"s3", name:"ברית חד-צדדית מול דו-צדדית", icon:"🤝", color:"#1E2761",
  qa:[
    ["לפי אברבנאל, מה משמעות \"לברית עולם\" ו\"להיות לך לאלהים\"?",
     "\"לברית עולם\" - ברית נצחית ומתמדת. \"להיות לך לאלהים\" - השגחת ה' תדבק באברהם וגם בזרעו אחריו, בזכותו."],
    ["מה ההבדל בין סוג הברית בפרק ט\"ו לסוג הברית בפרק י\"ז?",
     "ברית בין הבתרים חד-צדדית - רק ה' מתחייב. ברית המילה דו-צדדית - גם אברהם מתחייב לקיים מצווה בגופו."],
  ]
},
{ key:"s4", name:"שינוי השמות ובשורת יצחק", icon:"😊", color:"#8B4A34",
  qa:[
    ["מה משמעות השם \"אברהם\" לעומת \"אברם\"? ו\"שרה\" לעומת \"שרי\"?",
     "\"אברהם\" = \"אב המון גויים\". לפי רש\"י, \"שרי\" = \"שרי לי ולא לאחרים\", ו\"שרה\" = \"שתהא שרה על כל\". שינוי השמות מרחיב את שליחותם לתפקיד כלל-אנושי."],
    ["האם צחוקו של אברהם בפסוק י\"ז הוא צחוק ספק או שמחה? מה הוא מבקש בפסוק הבא?",
     "לפי רש\"י (אונקלוס: \"וחדי\") - צחוק של שמחה. הוא מבקש שישמעאל יחיה ויתקיים ביראת ה', ואומר שאינו ראוי לשכר גדול יותר."],
    ["מאיזו מילה נגזר השם \"יצחק\"?",
     "מהמילה \"וַיִּצְחָק\" (פסוק י\"ז) - צחוק השמחה של אברהם למשמע הבשורה."],
  ]
},
{ key:"s5", name:"קיום המצווה בזריזות", icon:"⚡", color:"#7A4A73",
  qa:[
    ["מה מדגישה התורה בביטוי \"בעצם היום הזה\"?",
     "אברהם מל מיד ביום שנצטווה, ביום ובגלוי - בלי לפחד מהגויים, מהליצנים או מאויביו."],
    ["פרק י\"ז מתאר שלוש הבטחות מרכזיות. מהן?",
     "הבטחת הזרע, הבטחת הארץ, וההבטחה החדשה - \"להיות לך לאלוקים ולזרעך אחריך\"."],
  ]
},
];

const deckArea = document.getElementById("deckArea");
const revealedCountEl = document.getElementById("revealedCount");
const totalCountEl = document.getElementById("totalCount");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateRevealedCount(){
  const total = document.querySelectorAll(".flip-card").length;
  const revealed = document.querySelectorAll(".flip-card.flipped").length;
  revealedCountEl.textContent = String(revealed);
  totalCountEl.textContent = String(total);
}

// הכרזה לקורא מסך על התשובה, ברגע שהכרטיס מתהפך
const flipLive = document.createElement("p");
flipLive.className = "bm-sr-only";
flipLive.setAttribute("aria-live", "polite");
document.body.appendChild(flipLive);

function plainText(html){
  const tmp = document.createElement("span");
  tmp.innerHTML = html;
  return tmp.textContent.trim();
}

// השם הנגיש כולל תמיד את השאלה; את התשובה - רק אחרי שהכרטיס הפוך
function setFlipped(card, flipped){
  card.classList.toggle("flipped", flipped);
  card.querySelector(".flip-back").setAttribute("aria-hidden", flipped ? "false" : "true");
  card.setAttribute("aria-label", flipped
    ? "שאלה: " + card.dataset.q + " — התשובה: " + card.dataset.a + ". לחצו כדי להסתיר את התשובה"
    : "שאלה: " + card.dataset.q + " — לחצו כדי לראות את התשובה");
}

function makeCard(q, a){
  const card = document.createElement("button");
  card.type = "button";
  card.className = "flip-card";
  card.dataset.q = plainText(q);
  card.dataset.a = plainText(a);
  card.innerHTML =
    '<span class="flip-inner">' +
      '<span class="flip-front">' + q + '<span class="flip-hint" aria-hidden="true">לחצו להפוך</span></span>' +
      '<span class="flip-back"><b>✓ </b>' + a + '</span>' +
    '</span>';
  setFlipped(card, false);
  card.addEventListener("click", () => {
    const flipped = !card.classList.contains("flipped");
    setFlipped(card, flipped);
    flipLive.textContent = flipped ? "התשובה: " + card.dataset.a : "";
    updateRevealedCount();
  });
  return card;
}

function renderDeck(shuffled){
  deckArea.innerHTML = "";
  TOPICS.forEach(topic => {
    const heading = document.createElement("div");
    heading.className = "topic-heading";
    heading.style.setProperty("--acc", topic.color);
    heading.innerHTML = '<span class="icon" aria-hidden="true">' + topic.icon + '</span>' + topic.name;
    deckArea.appendChild(heading);

    const grid = document.createElement("div");
    grid.className = "card-grid";
    const pairs = shuffled ? shuffle(topic.qa) : topic.qa;
    pairs.forEach(([q, a]) => grid.appendChild(makeCard(q, a)));
    deckArea.appendChild(grid);
  });
  updateRevealedCount();
}

document.getElementById("shuffleBtn").addEventListener("click", () => renderDeck(true));
document.getElementById("resetBtn").addEventListener("click", () => {
  document.querySelectorAll(".flip-card.flipped").forEach(c => setFlipped(c, false));
  updateRevealedCount();
});

renderDeck(false);
</script>

<script>
(function(){
  var btn = document.getElementById('toTopBtn');
  if(!btn) return;
  window.addEventListener('scroll', function(){
    btn.classList.toggle('show', window.scrollY > 400);
  }, { passive:true });
  btn.addEventListener('click', function(){
    window.scrollTo({ top:0, behavior: 'smooth' });
  });
})();
</script>
