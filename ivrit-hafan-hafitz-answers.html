  function b64ToUtf8(b64){
    var binary = window.atob(b64);
    var bytes = new Uint8Array(binary.length);
    for(var i = 0; i < binary.length; i++){ bytes[i] = binary.charCodeAt(i); }
    return new TextDecoder("utf-8").decode(bytes);
  }

  function unlockContent(){
    if(gatedContent.childElementCount === 0){
      gatedContent.innerHTML = b64ToUtf8(window.LOCKED_HTML_B64);

        unlockContent();
        gateBtn.textContent = '🔓 הקוד אושר';
        gateBtn.disabled = true;
      });

    gateBtn.addEventListener('click', function(){
      var code = prompt('הקלידו את הקוד שקיבלתם מהמורה כדי לפתוח את המחוון:');

      if(code.trim() === ANSWERS_CODE){
        try{ sessionStorage.setItem('teacherAreaUnlocked', '1'); }catch(e){}
        unlockContent();
        gateBtn.textContent = '🔓 הקוד אושר';
        gateBtn.disabled = true;
      } else {
        alert('קוד שגוי. נסו שוב, או שאלו את המורה.');
      }
    });
  }
})();
