  function decode(b){ var bin = atob(b), a = new Uint8Array(bin.length); for(var i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new TextDecoder("utf-8").decode(a); }
  function reveal(asTeacher){
    root.innerHTML = (asTeacher ? '<p class="exam-teacher-note">👁️ תצוגת מורה - תלמידים רואים את המבחן רק אחרי שהקלידו קוד פעיל.</p>' : '') + decode(EXAM_B64);
    gate.hidden = true; root.hidden = false;
    /* שמירה אוטומטית במכשיר */
    var saved = {}; try{ saved = JSON.parse(localStorage.getItem(STORE) || "{}") || {}; }catch(e){}
    var fields = root.querySelectorAll("textarea.answer, #studentName, #studentClass");
    Array.prototype.forEach.call(fields, function(f){
      var k = f.getAttribute("data-id") || f.id;
      if(saved[k]) f.value = saved[k];
      f.addEventListener("input", function(){ saved[k] = f.value; try{ localStorage.setItem(STORE, JSON.stringify(saved)); }catch(e){} });
    });
    load("assets/units-data.js", function(){ load("assets/direct-submit.js", function(){ load("assets/send-to-teacher.js?v=2"); }); });
  }
  verifyTeacher().then(function(isTeacher){
  if(isTeacher){ reveal(true); return; }
  var key = null; try{ key = JSON.parse(localStorage.getItem("bm-lesson-key") || "null"); }catch(e){}
  var code = key && key.page === PAGE && key.until > Date.now() ? key.code : "";
  if(!window.BM_API_URL){ closed("המבחן סגור", "אין חיבור לשרת."); return; }
  fetch(window.BM_API_URL + "?action=lessonLock&page=" + encodeURIComponent(PAGE) + "&code=" + encodeURIComponent(code))
    .then(function(r){ return r.json(); })
    .then(function(res){
      if(res && res.ok && res.lessonPage === PAGE && res.locked === false){ reveal(false); return; }
      if(res && res.ok && res.lessonPage === PAGE){ closed("המבחן פתוח רק עם קוד", "הקלידו את הקוד שעל הלוח."); return; }
      closed("המבחן סגור כרגע", "המורה יפתח את המבחן עם קוד בתחילת השיעור. את הקוד מקלידים בדף הבית, בתיבה \"יש לכם קוד מהמורה?\".");
    })
    .catch(function(){ closed("אין חיבור לשרת", "בדקו את האינטרנט ורעננו את הדף."); });
  });
})();
</script>
<script src="assets/lesson-mode.js"></script>
</body>
