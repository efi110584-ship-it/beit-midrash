<!DOCTYPE html>
<html lang="he" dir="rtl" data-css="view-presentation">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>צפייה במצגת | הכיתה הדיגיטלית</title>
<link rel="stylesheet" href="assets/site.css?v=3">

<script src="assets/a11y.js"></script>
</head>
<body>
<a class="bm-skip-link" href="#main-content">דלג לתוכן הראשי</a>

<header>
  <h1 id="pageTitle">צפייה במצגת</h1>
  <a href="index.html">&rarr; חזרה לאתר</a>
</header>

<div class="viewer-wrap" id="main-content" role="main">
  <iframe id="viewerFrame" title="מצגת" allowfullscreen></iframe>
</div>

<div class="fallback" id="fallback">
  <p>לא ניתן לטעון את המצגת לצפייה ישירה כרגע (למשל אם הדף נפתח מהמחשב ולא מהאתר החי, או שאין חיבור לאינטרנט).</p>
  <a class="dl" id="fallbackLink" href="#">פתיחת קובץ המצגת</a>
</div>

<script>
(function(){
  "use strict";
  var params = new URLSearchParams(location.search);
  var file = params.get("file");
  var titleParam = params.get("title");
  var fallback = document.getElementById("fallback");
  var fallbackLink = document.getElementById("fallbackLink");
  var frame = document.getElementById("viewerFrame");

  if(!file){
    fallback.classList.add("show");
    fallbackLink.style.display = "none";
    fallback.querySelector("p").textContent = "לא צוין קובץ מצגת לצפייה.";
    return;
  }

  if(titleParam){
    document.title = titleParam + " | הכיתה הדיגיטלית";
    document.getElementById("pageTitle").textContent = titleParam;
  }

  var absoluteUrl = new URL(file, location.href).href;
  fallbackLink.href = absoluteUrl;

  if(location.protocol === "file:"){
    /* שירות הצפייה מרחוק לא יכול לגשת לקובץ שנפתח ישירות מהמחשב - רק לאתר חי */
    fallback.classList.add("show");
  } else {
    var viewerUrl = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(absoluteUrl);
    frame.src = viewerUrl;
  }
})();
</script>

</body>
</html>
